<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>Grand opening · Salt Effect 12/76</title>
<!-- PARTY DEPT confetti engine: paper flutter with two-sided pieces, side poppers, click bursts, salt grains. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif; font-size:17px; line-height:1.55;
    background:
      radial-gradient(70% 45% at 50% 12%, rgba(233,161,59,.16), transparent 70%),
      radial-gradient(120% 80% at 50% 110%, var(--ink-0), transparent 70%),
      var(--ink-1); }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  canvas { position:fixed; inset:0; z-index:20; pointer-events:none; }

  /* string lights */
  .lights { position:fixed; left:0; top:44px; width:100%; height:230px; z-index:1; pointer-events:none; overflow:visible; }
  .lights .wire { fill:none; stroke:rgba(179,170,205,.35); stroke-width:1.2; }
  .lights .bulb { fill:var(--amber-hi); }
  .lights .halo { fill:url(#halo); animation:tw 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes tw { 0%,100% { opacity:.95; } 50% { opacity:.55; } }

  .center { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:24px; padding:96px 20px 60px; }
  h1 { position:relative; z-index:2; font-family:'Fraunces',Georgia,serif; font-weight:580; font-size:clamp(58px,10.5vw,168px); line-height:.92; letter-spacing:-.02em; color:var(--bone); }
  h1 em { font-style:italic; font-weight:500; color:var(--amber); }
  .line { max-width:31em; color:var(--mist); }
  .line b { font-weight:500; color:var(--lilac); }

  /* the ribbon */
  .ribbon { position:fixed; left:0; right:0; z-index:1; height:16px; pointer-events:none; }
  .ribbon i { position:absolute; top:0; height:100%; width:50.5%;
    background:linear-gradient(180deg, #f0b055 0%, #e9a13b 45%, #b97a24 100%); box-shadow:0 6px 24px rgba(233,161,59,.25);
    transition:transform 1.4s cubic-bezier(.3,1.5,.5,1), opacity .9s ease .6s; }
  .ribbon i.l { left:0; transform-origin:0 50%; }
  .ribbon i.r { right:0; transform-origin:100% 50%; }
  .ribbon.cut i.l { transform:rotate(58deg); opacity:0; }
  .ribbon.cut i.r { transform:rotate(-58deg); opacity:0; }
  .ribbon.tie i { transition:opacity 1.2s ease; }

  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn { font:500 15px/1 'Instrument Sans',system-ui,sans-serif; border-radius:999px; padding:16px 26px; cursor:pointer;
    border:1px solid var(--amber); background:var(--amber); color:var(--ink-0);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .25s, color .25s; }
  .btn:hover { transform:scale(1.06) rotate(-1.2deg); background:var(--amber-hi); }
  .btn.ghost { background:rgba(24,15,47,.55); color:var(--bone); border-color:rgba(179,170,205,.45); }
  .btn.ghost:hover { border-color:var(--amber); color:var(--amber-hi); background:rgba(24,15,47,.8); }
  .hud { position:fixed; z-index:30; }
  .t1{ top:88px; left:clamp(20px,4vw,48px); } .t1 b { color:var(--amber); font-weight:400; }
  .t2{ top:88px; right:clamp(20px,4vw,48px); }
  .b1{ bottom:26px; left:clamp(20px,4vw,48px); } .b2{ bottom:26px; right:clamp(20px,4vw,48px); }
  @media (max-width:700px){
    .t2, .b2 { display:none; }
    .b1 { left:0; right:0; text-align:center; }
    .btn { padding:15px 20px; }
    .row { gap:10px; }
  }
</style>
</head>
<body>
  <svg class="lights" id="lights" aria-hidden="true">
    <defs><radialGradient id="halo"><stop offset="0" stop-color="#f0b055" stop-opacity=".55"/><stop offset="1" stop-color="#e9a13b" stop-opacity="0"/></radialGradient></defs>
    <path class="wire" id="wire" d=""/>
    <g id="bulbs"></g>
  </svg>

  <div class="ribbon" id="ribbon" aria-hidden="true"><i class="l"></i><i class="r"></i></div>

  <canvas id="cv"></canvas>
  <div class="center">
    <h1 id="title">Grand <em>opening!</em></h1>
    <p class="line">Ribbon, folding chairs, cookies on a paper plate. <b>Click anywhere to celebrate.</b></p>
    <div class="row">
      <button class="btn" id="burstBtn">Cut the ribbon</button>
      <button class="btn ghost" id="cannonBtn">Party poppers</button>
      <button class="btn ghost" id="rainBtn">A pinch of salt</button>
    </div>
  </div>
  <span class="mono hud t1"><b>II · The door</b> — 12/76</span>
  <span class="mono hud t2">Kodak, TN · 35.97° N, 83.62° W</span>
  <span class="mono hud b1">Opening day · doors at 7:00 AM</span>
  <span class="mono hud b2">Cookies: while they last</span>

<script>
/* string lights: two swags across the top, drawn at the real width so bulbs stay round */
function drawLights(){
  const svg = document.getElementById('lights'), wire = document.getElementById('wire'), g = document.getElementById('bulbs');
  const w = innerWidth, sag = w < 700 ? 60 : 95, y0 = 74;
  svg.setAttribute('viewBox', `0 0 ${w} 230`);
  wire.setAttribute('d', `M-30 ${y0 - 14} Q ${w * .25} ${y0 + sag * 2} ${w * .5} ${y0} Q ${w * .75} ${y0 + sag * 2} ${w + 30} ${y0 - 14}`);
  const L = wire.getTotalLength(), N = Math.max(12, Math.round(w / 64));
  let s = '';
  for (let i = 1; i < N; i++){
    const p = wire.getPointAtLength(L * i / N);
    s += `<circle class="halo" cx="${p.x}" cy="${p.y + 8}" r="24" style="animation-delay:${(i * 0.37 % 3).toFixed(2)}s"/><circle class="bulb" cx="${p.x}" cy="${p.y + 8}" r="4"/>`;
  }
  g.innerHTML = s;
}
drawLights();

/* ================= SLOTS ================= */
/* each colour: [front, back] so a flipping piece flashes its other side */
const COLORS = [['#e9a13b','#f0b055'],['#f0b055','#e9a13b'],['#f5f3ed','#ece9e0'],['#eae7f4','#b3aacd'],['#2b1d52','#b3aacd'],['#635a7d','#eae7f4']];
const GRAVITY = .22;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio || 1, 2);
const fit = () => { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(DPR,0,0,DPR,0,0); };
fit(); addEventListener('resize', () => { fit(); placeRibbon(); drawLights(); });

const paper = [];
const MAX = 1400;
function piece(x, y, vx, vy){
  if (paper.length > MAX) paper.shift();
  const salt = Math.random() < .22;              /* little salt grains among the paper */
  const c = COLORS[Math.floor(Math.random()*COLORS.length)];
  paper.push({
    x, y, vx: salt ? vx*.8 : vx, vy,
    w: salt ? Math.random()*2 + 2 : Math.random()*8 + 5,
    h: salt ? 0 : Math.random()*5 + 4,
    rot: Math.random()*Math.PI*2, vr: (Math.random()-.5)*.35,
    flut: Math.random()*Math.PI*2,
    c: salt ? '#f5f3ed' : c[0], b: salt ? '#f5f3ed' : c[1],
    salt, life: 1
  });
}
function burst(x, y, n = 120, power = 13){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, f = Math.random()*power + 3;
    piece(x, y, Math.cos(a)*f, Math.sin(a)*f - 4);
  }
}
function cannons(){
  const k = W < 700 ? .62 : 1;
  for (let i = 0; i < 110; i++){
    const left = i % 2 === 0;
    piece(left ? -8 : W + 8, H * .74,
      (left ? 1 : -1) * (Math.random()*14 + 9) * k,
      -(Math.random()*13 + 8));
  }
}
function rain(){
  for (let i = 0; i < 220; i++){
    piece(Math.random()*W, -20 - Math.random()*H*.5, (Math.random()-.5)*1.5, Math.random()*2);
    if (i % 2) { const p = paper[paper.length-1]; p.salt = true; p.c = p.b = '#f5f3ed'; p.w = Math.random()*2 + 1.6; p.h = 0; }
  }
}

/* the ribbon sits just under the headline */
const ribbon = document.getElementById('ribbon'), title = document.getElementById('title');
function ribbonY(){ const r = title.getBoundingClientRect(), lh = parseFloat(getComputedStyle(title).fontSize) * .92; return r.top + lh * .56; }
function placeRibbon(){ ribbon.style.top = (ribbonY() - 8) + 'px'; }
placeRibbon(); document.fonts && document.fonts.ready.then(placeRibbon);
/* reduced motion: nothing fires on its own; the ribbon is already cut and confetti comes only on click */
const REDUCE = !!(window.SCENE && SCENE.reduce);
if (REDUCE) ribbon.classList.add('cut');
const wake = () => { if (REDUCE && SCENE.thaw) SCENE.thaw(6000); };   /* let the frames run while the click's confetti falls */
let tieTimer;
function cutRibbon(){
  const y = ribbonY();
  if (!ribbon.classList.contains('cut')) {
    ribbon.classList.remove('tie'); ribbon.classList.add('cut');
    burst(W/2, y, 200, 16);
    clearTimeout(tieTimer);
    if (!REDUCE) tieTimer = setTimeout(() => { ribbon.classList.remove('cut'); ribbon.classList.add('tie'); }, 5200);
  } else burst(W/2, y, 160, 15);
}

document.getElementById('burstBtn').addEventListener('click', e => { e.stopPropagation(); wake(); cutRibbon(); });
document.getElementById('cannonBtn').addEventListener('click', e => { e.stopPropagation(); wake(); cannons(); });
document.getElementById('rainBtn').addEventListener('click', e => { e.stopPropagation(); wake(); rain(); });
addEventListener('click', e => { wake(); burst(e.clientX, e.clientY, 70, 10); });

/* idle: a small celebration every few seconds while the scene is on screen */
let lastAct = 0, visible = true;
['click','mousemove'].forEach(ev => addEventListener(ev, () => lastAct = performance.now()));
if (!REDUCE) setInterval(() => {
  if (visible && performance.now() - lastAct > 3600) burst(W * (.3 + Math.random()*.4), H * (.3 + Math.random()*.3), 80, 11);
}, 2600);
addEventListener('scene:leave', () => visible = false);
addEventListener('scene:enter', () => { visible = true; });

(function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0, 0, W, H);
  for (let i = paper.length - 1; i >= 0; i--){
    const p = paper[i];
    p.flut += .18;
    if (p.salt){
      p.vy += GRAVITY * 1.1; p.vx *= .985; p.vy *= .985;    /* grains drop straighter, no flutter */
    } else {
      p.vy += GRAVITY;
      p.vx += Math.sin(p.flut) * .12;
      p.vx *= .992; p.vy *= .992;
    }
    p.x += p.vx; p.y += p.vy;
    p.rot += p.vr + Math.sin(p.flut) * .04;
    if (p.y > H * .82) p.life -= .025;
    if (p.life <= 0 || p.y > H + 40){ paper.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    if (p.salt){
      ctx.fillStyle = p.c;
      ctx.globalAlpha = p.life * (.65 + .35 * Math.sin(p.flut * 1.7));   /* glints */
      ctx.fillRect(p.x, p.y, p.w, p.w);
      continue;
    }
    const s = Math.sin(p.flut);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(1, Math.abs(s) * .8 + .2);
    ctx.fillStyle = s > 0 ? p.c : p.b;          /* two-sided paper */
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
})();

/* opening salute: waits for the visitor, replays on return */
if (!REDUCE){
  SCENE.onFirstEnter(() => setTimeout(cutRibbon, 1100));
  addEventListener('scene:enter', () => { if (!ribbon.classList.contains('cut')) setTimeout(cutRibbon, 1100); });
}
</script>
<!-- SIGNATURE CURSOR -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; }
  #wlDot{ width:7px; height:7px; border-radius:50%; background:var(--bone); transform:translate(-50%,-50%); }
  #wlRing{ width:37px; height:37px; border-radius:50%; border:2px solid rgba(245,243,237,.7); transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease; }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2.5px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:76px; height:76px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  dot.style.opacity=ring.style.opacity='0';   /* hidden until the first pointer move, so nothing parks over the copy */
  document.body.append(dot,ring);
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{if(ring.style.opacity){rx=e.clientX;ry=e.clientY;dot.style.opacity=ring.style.opacity='';}mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
  document.body.addEventListener('mouseover',e=>{
    const hit = e.target.closest('a,button');
    ring.style.width = hit ? '62px' : '37px'; ring.style.height = hit ? '62px' : '37px';
  });
})();
</script>
</body>
</html>
