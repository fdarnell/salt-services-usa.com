<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>The Salt Effect · What people type</title>
<!-- TERMINAL 9 · Data Rain Dashboard. Story position 47/76, Chapter V · The signal.
     Columns of letters rain down behind three cards; each column spells out a real kind of local
     search, and the cards type them out one after another. The rain parts around the cursor. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:var(--ink-0);color:var(--lilac);font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  .panel{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
    pointer-events:none;padding:96px 16px 72px}
  .panel::before{content:"";position:absolute;left:50%;top:50%;width:min(1100px,110vw);height:70vh;transform:translate(-50%,-50%);z-index:-1;
    background:radial-gradient(closest-side, rgba(14,8,31,.9) 35%, rgba(14,8,31,0))}
  .kicker{color:var(--amber)}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(40px,6vw,88px);letter-spacing:-.02em;text-align:center;line-height:.95;
    color:var(--bone);text-shadow:0 2px 30px rgba(14,8,31,.9);margin-top:-14px}
  h1 em{font-style:italic;color:var(--amber-hi)}
  .cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:min(1120px,100%)}
  .card{flex:1 1 310px;max-width:360px;background:rgba(24,15,47,.84);border:1px solid rgba(179,170,205,.2);border-radius:12px;padding:18px 22px 16px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:left}
  .card .val{display:block;font-family:'Space Mono',ui-monospace,monospace;font-size:17px;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:clip;min-height:1.5em}
  .card .val::after{content:"";display:inline-block;width:2px;height:1em;background:var(--amber);margin-left:2px;vertical-align:-2px;animation:bl 1s steps(2) infinite}
  .card .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
  .card .tag{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
  .card .tag::before{content:"● ";font-size:9px;vertical-align:1px}
  .hud{position:fixed;z-index:10;text-shadow:0 0 8px var(--ink-0),0 0 16px var(--ink-0)}
  .t1{top:84px;left:32px} .t2{top:84px;right:32px;text-align:right} .b1{bottom:26px;left:32px} .b2{bottom:26px;right:32px;text-align:right}
  .live{color:var(--amber);animation:bl 1.4s steps(2) infinite}
  @keyframes bl{50%{opacity:.35}}
  .touch{display:none}
  @media (hover:none){ .fine{display:none} .touch{display:inline} }
  @media (max-width:640px){
    .t1{left:16px;top:80px} .t2{display:none} .b1{left:16px;bottom:18px} .b2{display:none}
    .panel{gap:22px;padding:110px 16px 60px}
    .cards{gap:10px}
    .card{flex-basis:100%;max-width:none;padding:14px 16px 12px}
    .card .val{font-size:16px}
  }
</style>
</head>
<body>
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="panel">
    <span class="mono kicker">Example searches · East Tennessee</span>
    <h1>What people are <em>typing</em></h1>
    <div class="cards" aria-live="off">
      <div class="card"><span class="val" id="v0"></span><div class="row"><span class="mono">Example search</span><span class="tag" id="d0">Near me</span></div></div>
      <div class="card"><span class="val" id="v1"></span><div class="row"><span class="mono">Example search</span><span class="tag" id="d1">Town name</span></div></div>
      <div class="card"><span class="val" id="v2"></span><div class="row"><span class="mono">Example search</span><span class="tag" id="d2">Urgent</span></div></div>
    </div>
  </div>
  <span class="mono hud t1">V · The signal — 47/76</span>
  <span class="mono hud t2"><span class="live">●</span> Example feed, not live data</span>
  <span class="mono hud b1"><span class="fine">The rain parts around your cursor</span><span class="touch">Touch the rain · it parts around you</span></span>
  <span class="mono hud b2">35.97° N, 83.62° W</span>

<script>
(function(){
  /* the searches, each with what kind of search it is */
  const SEARCHES = [
    ['plumber near me', 'Near me'],
    ['cabin cleaning sevierville', 'Town name'],
    ['roof leak emergency', 'Urgent'],
    ['dentist open saturday', 'Hours'],
    ['best bbq knoxville', 'Best of'],
    ['landscaper kodak tn', 'Town name'],
    ['who fixes garage doors', 'A question'],
    ['wedding florist gatlinburg', 'Town name']
  ];

  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let W, H, DPR, cols, drops;
  const FS = innerWidth < 640 ? 14 : 16;
  function fit(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cols = Math.floor(W / FS);
    drops = Array.from({ length: cols }, () => newDrop(Math.random() * -H));
    ctx.fillStyle = '#0e081f'; ctx.fillRect(0, 0, W, H);
  }
  /* each column spells one search, letter by letter, top to bottom */
  function newDrop(y){
    return { y, v: Math.random() * 2.4 + 1.6, s: SEARCHES[Math.floor(Math.random() * SEARCHES.length)][0], k: 0 };
  }
  fit(); addEventListener('resize', fit);

  let mx = -9999, my = -9999;
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  addEventListener('pointerdown', e => { mx = e.clientX; my = e.clientY; });
  document.addEventListener('mouseleave', () => { mx = my = -9999; });

  setInterval(() => {                        /* the rain frame, classic cadence */
    ctx.fillStyle = 'rgba(14,8,31,.1)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = FS + "px 'Space Mono', ui-monospace, monospace";
    for (let i = 0; i < cols; i++){
      const d = drops[i];
      const x = i * FS;
      const dx = x - mx, dy = d.y - my;
      const near = dx * dx + dy * dy < 9000;
      const ch = d.s[d.k % d.s.length];
      d.k++;
      if (!near && ch !== ' '){
        const head = Math.random() < .06;
        ctx.fillStyle = head ? '#f0b055' : `rgba(179,170,205,${.28 + Math.random() * .4})`;
        ctx.fillText(ch, x, d.y);
      }
      d.y += d.v * FS * .5;
      if (d.y > H + 40) drops[i] = newDrop(Math.random() * -200);
    }
  }, 46);

  /* the cards: each types a search, holds it, and hands over to the next */
  const vals = [0, 1, 2].map(i => document.getElementById('v' + i));
  const tags = [0, 1, 2].map(i => document.getElementById('d' + i));
  let next = 0;
  function cycle(slot, delay){
    setTimeout(function run(){
      const [q, tag] = SEARCHES[next++ % SEARCHES.length];
      tags[slot].textContent = tag;
      let n = 0;
      (function step(){
        vals[slot].textContent = q.slice(0, n);
        if (n++ < q.length) setTimeout(step, 55 + Math.random() * 70);
        else setTimeout(run, 3400 + Math.random() * 1200);
      })();
    }, delay);
  }
  SCENE.onFirstEnter(() => { cycle(0, 200); cycle(1, 1300); cycle(2, 2400); });
})();
</script>

<!-- cursor (fine pointers only) -->
<style>
@media (hover:hover) and (pointer:fine){
  *{cursor:none !important}
  #wlDot,#wlRing{position:fixed;top:0;left:0;pointer-events:none;z-index:9999}
  #wlDot{width:6px;height:6px;border-radius:50%;background:var(--amber-hi);transform:translate(-50%,-50%)}
  #wlRing{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(233,161,59,.85);transform:translate(-50%,-50%)}
  .wlRipple{position:fixed;pointer-events:none;z-index:9998;width:8px;height:8px;border-radius:50%;border:2px solid var(--amber);transform:translate(-50%,-50%);animation:wlrip .55s ease-out forwards}
  @keyframes wlrip{to{width:70px;height:70px;opacity:0}}
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot = document.createElement('div'); dot.id = 'wlDot';
  const ring = document.createElement('div'); ring.id = 'wlRing';
  document.body.append(dot, ring);
  let mx = -100, my = -100, rx = mx, ry = my;
  addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; });
  (function f(){ rx += (mx - rx) * .16; ry += (my - ry) * .16; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(f); })();
  addEventListener('mousedown', e => { const r = document.createElement('div'); r.className = 'wlRipple'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 600); });
})();
</script>
</body>
</html>
