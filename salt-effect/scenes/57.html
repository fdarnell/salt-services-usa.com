<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<script src="_bridge.js"></script>
<title>A reputation drifts · Salt Services</title>
<!-- INCENSE · smoke trails. Soft smoke rises from the cursor's path, curls and dissolves.
     Slow movement gives thick ribbons, fast gives scattered puffs. Idle, an ember burns on its own. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:radial-gradient(ellipse 60% 50% at 50% 78%, var(--ink-2) 0%, var(--ink-1) 45%, var(--ink-0) 100%); color:var(--bone); font-family:'Instrument Sans',system-ui,sans-serif; }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  .title { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); z-index:5; text-align:center; pointer-events:none; width:min(92vw,1000px); }
  .title h1 { font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:clamp(46px,7vw,112px); line-height:.95; letter-spacing:-.02em; }
  .title h1 em { font-style:italic; font-weight:500; color:var(--amber); }
  .title p { margin-top:22px; font-size:clamp(17px,1.5vw,21px); line-height:1.55; color:var(--lilac); }
  .title > * { opacity:0; filter:blur(10px); transform:translateY(-14px); transition:opacity 2.2s ease, filter 2.2s ease, transform 2.2s cubic-bezier(.2,.7,.2,1); }
  .go .title > * { opacity:1; filter:none; transform:none; }
  .go .title p { transition-delay:.7s; }
  .hud { position:fixed; z-index:10; }
  .b1 { bottom:30px; left:36px; } .b2 { bottom:30px; right:36px; text-align:right; }
  @media (max-width:700px){
    .title { top:28%; }
    .title h1 { font-size:50px; }
    .b1 { left:20px; bottom:24px; } .b2 { left:20px; right:auto; text-align:left; bottom:46px; }
  }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="title">
    <h1>A reputation <em>drifts.</em></h1>
    <p>Give it something good to carry.</p>
  </div>
  <span class="mono hud b1">VI · The world — 62/76</span>
  <span class="mono hud b2" id="hint">Move slowly · the smoke follows</span>

<script>
const SMOKE = [179, 170, 205];       /* --mist: lavender smoke */
const EMBER = [240, 176, 85];        /* --amber-hi: warm near the ember */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H;
let ground;
const RES = .5;          /* smoke is soft: draw it at half size and let the browser smooth it up */
/* the canvas repaints its own warm ground a little each frame, which is what leaves the trails */
const fit = () => {
  W = innerWidth; H = innerHeight;
  cv.width = Math.ceil(W * RES); cv.height = Math.ceil(H * RES); ctx.setTransform(RES, 0, 0, RES, 0, 0);
  ground = ctx.createRadialGradient(W/2, H*.78, 0, W/2, H*.78, Math.max(W, H) * .7);
  ground.addColorStop(0, '#2b1d52'); ground.addColorStop(.45, '#180f2f'); ground.addColorStop(1, '#0e081f');
  ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H);
};
fit(); addEventListener('resize', fit);
if (matchMedia('(hover:none)').matches) document.getElementById('hint').textContent = 'Drag a finger · the smoke follows';

const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
/* soft puff sprites, lavender to amber, drawn once (smoother and far cheaper than a gradient per puff) */
const SPR = Array.from({ length:8 }, (_, k) => {
  const w = k / 7, c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64,64,0,64,64,64);
  const r = SMOKE[0] + (EMBER[0] - SMOKE[0]) * w | 0, gg = SMOKE[1] + (EMBER[1] - SMOKE[1]) * w | 0, b = SMOKE[2] + (EMBER[2] - SMOKE[2]) * w | 0;
  g.addColorStop(0, `rgba(${r},${gg},${b},1)`); g.addColorStop(.5, `rgba(${r},${gg},${b},.45)`); g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  x.fillStyle = g; x.fillRect(0,0,128,128); return c;
});
const puffs = [];
let mx = W/2, my = H*.72, pmx = mx, pmy = my, lastMove = -1e9;
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; lastMove = performance.now(); });

SCENE.onFirstEnter(() => document.body.classList.add('go'));
let running = true;
addEventListener('scene:leave', () => running = false);
addEventListener('scene:enter', () => running = true);
addEventListener('scene:progress', () => running = true);

(function loop(){
  requestAnimationFrame(loop);
  if (!running) return;
  const now = performance.now(), t = now / 1000;
  const idle = now - lastMove > 2800;
  /* idle: an ember burns low in the frame, swaying slowly */
  if (idle){
    mx = W * (.5 + Math.cos(t * .3) * (W < 700 ? .12 : .18));
    my = H * (W < 700 ? .74 : .72);
  }
  const vx = mx - pmx, vy = my - pmy;
  const speed = Math.hypot(vx, vy);
  pmx += vx * .3; pmy += vy * .3;

  /* spawn: slow = dense ribbon, fast = sparse puffs */
  const n = speed < 4 ? 2 : Math.max(1, 5 - speed * .1);
  for (let i = 0; i < n; i++){
    puffs.push({
      x: pmx + (Math.random()-.5)*8, y: pmy + (Math.random()-.5)*8,
      vx: vx * .04 + (Math.random()-.5)*.5,
      vy: vy * .04 - Math.random()*1.1 - .8,       /* smoke rises */
      r: Math.random()*14 + 12,
      life: 1, curl: Math.random()*Math.PI*2
    });
  }
  if (puffs.length > 800) puffs.splice(0, puffs.length - 800);

  ctx.globalAlpha = .14; ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'screen';
  for (let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i];
    p.curl += .05;
    p.vx += Math.sin(p.curl + p.y * .01) * .06;    /* curl */
    p.vy -= .009;                                  /* warm air keeps lifting it */
    p.vx *= .985; p.vy *= .994;
    p.x += p.vx; p.y += p.vy;
    p.r += .62;                                     /* smoke expands */
    p.life -= .0075;
    if (p.life <= 0){ puffs.splice(i, 1); continue; }
    /* amber where it leaves the ember, lavender as it climbs */
    const w = Math.max(0, (p.life - .72) / .28);
    ctx.globalAlpha = p.life * p.life * .065;
    ctx.drawImage(SPR[Math.round(w * (SPR.length - 1))], p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  /* the ember itself (idle, or on touch screens where there is no cursor dot) */
  ctx.globalAlpha = 1;
  if (idle || !fine) {
    const flick = .8 + Math.sin(t * 9) * .08 + Math.sin(t * 23) * .05;
    const eg = ctx.createRadialGradient(pmx, pmy, 0, pmx, pmy, 26);
    eg.addColorStop(0, `rgba(245,243,237,${.9 * flick})`);
    eg.addColorStop(.12, `rgba(240,176,85,${.85 * flick})`);
    eg.addColorStop(1, 'rgba(233,161,59,0)');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(pmx, pmy, 26, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
})();
</script>
<!-- signature cursor: an ember tip (fine pointers only) -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; opacity:0; transition:opacity .3s; }
  .cur-on #wlDot,.cur-on #wlRing{ opacity:1; }
  #wlDot{ width:7px; height:7px; border-radius:50%; background:var(--amber-hi); transform:translate(-50%,-50%); box-shadow:0 0 14px rgba(240,176,85,.9); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1px solid rgba(179,170,205,.5); transform:translate(-50%,-50%); }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--mist); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring);
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my,t0=0;
  addEventListener('mousemove',e=>{document.body.classList.add('cur-on');t0=performance.now();mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';
    if(performance.now()-t0>2800)document.body.classList.remove('cur-on');requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
})();
</script>
</body>
</html>
