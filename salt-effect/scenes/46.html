<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>Trust wears away</title>
<!-- 51/76 · DUNE text erosion: the word is made of salt grains. The cursor is the wind:
     sweep it and the letters erode, drift downwind, then settle back. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{--ink-0:#0e081f;--ink-1:#180f2f;--ink-2:#2b1d52;--amber:#e9a13b;--amber-hi:#f0b055;--bone:#f5f3ed;--bone-2:#ece9e0;--lilac:#eae7f4;--mist:#b3aacd;--plum:#635a7d;--ink-text:#201439}
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--ink-0); color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif; }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  canvas { position:fixed; inset:0; }
  .head { position:fixed; z-index:5; left:0; right:0; top:clamp(110px,15vh,150px); text-align:center; padding:0 16px; pointer-events:none; }
  h1 { font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(34px,4.4vw,64px); line-height:1; letter-spacing:-.02em; color:var(--bone); }
  h1 em { font-style:italic; font-weight:500; color:var(--amber-hi); }
  .foot { position:fixed; z-index:5; left:0; right:0; bottom:clamp(70px,12vh,120px); text-align:center; padding:0 16px; pointer-events:none; }
  .line { font-size:clamp(17px,1.5vw,20px); line-height:1.55; color:var(--lilac); }
  #call { margin-top:14px; min-height:18px; color:var(--mist); transition:opacity .4s; }
  #call b { font-weight:400; color:var(--amber-hi); }
  .hud { position:fixed; z-index:10; }
  .t1{ top:88px; left:32px; }
  .b1{ bottom:26px; left:32px; } .b2{ bottom:26px; right:32px; }
  @media (max-width:760px){ .t1,.b1{ left:16px; } .b2{ display:none; } .head{ top:27vh; } .foot{ bottom:25vh; } }
  @media (hover:none){ .hint-fine{ display:none; } }
  @media (hover:hover){ .hint-touch{ display:none; } }
</style>
</head>
<body>
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="head"><h1>A missed call wears <em>trust</em> away.</h1></div>
  <div class="foot">
    <p class="line">Grain by grain, voicemail by voicemail.</p>
    <p class="mono" id="call"></p>
  </div>
  <span class="mono hud t1">V · The signal — 51/76</span>
  <span class="mono hud b1"><span class="hint-fine">Sweep the cursor, you are the wind</span><span class="hint-touch">Swipe across the word</span></span>
  <span class="mono hud b2">Kodak, TN · 35.97° N, 83.62° W</span>

<script>
const WORD = 'TRUST';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H, GAP, grains = [];

/* salt grains: mostly bone, some lilac-grey, a few amber sparks */
function grainColor(){ const r = Math.random(); return r < .66 ? '#f5f3ed' : r < .9 ? '#b3aacd' : '#e9a13b'; }

function build(){
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  GAP = W < 760 ? 2 : 3;
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const o = off.getContext('2d', { willReadFrequently: true });
  let fs = Math.min(W * .86 / (WORD.length * .7), H * .4);
  o.font = `600 ${fs}px Fraunces, Georgia, serif`;
  const mw = o.measureText(WORD).width;
  if (mw > W * .88){ fs *= W * .88 / mw; o.font = `600 ${fs}px Fraunces, Georgia, serif`; }
  o.textAlign = 'center'; o.textBaseline = 'middle';
  o.fillStyle = o.strokeStyle = '#fff'; o.lineJoin = 'round'; o.lineWidth = Math.max(2, fs * .025);
  o.fillText(WORD, W/2, H * .52); o.strokeText(WORD, W/2, H * .52);
  const px = o.getImageData(0, 0, W, H).data;
  grains = [];
  for (let y = 0; y < H; y += GAP) for (let x = 0; x < W; x += GAP){
    if (px[(y*W + x)*4 + 3] > 128){
      grains.push({ hx:x, hy:y, x, y, vx:0, vy:0, flying:0, c:grainColor(), s:Math.random()*1.5 + (GAP < 3 ? .6 : .7) });
    }
  }
  ctx.fillStyle = '#0e081f'; ctx.fillRect(0, 0, W, H);
}
build(); addEventListener('resize', build);
if (document.fonts) document.fonts.load('600 100px Fraunces').then(build, () => {});

let mx = -9999, my = -9999, pmx = -9999, pmy = -9999, lastMove = -1e9;
const take = (x, y) => { mx = x; my = y; lastMove = performance.now(); };
addEventListener('pointermove', e => take(e.clientX, e.clientY));
addEventListener('touchmove', e => take(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
addEventListener('touchstart', e => { pmx = mx = e.touches[0].clientX; pmy = my = e.touches[0].clientY; lastMove = performance.now(); }, { passive: true });

(function loop(){
  requestAnimationFrame(loop);
  /* idle wind: sweeps across the word */
  if (performance.now() - lastMove > 3000){
    const t = performance.now() / 1600;
    mx = W * (.5 + Math.cos(t) * .42);
    my = H * (.52 + Math.sin(t * 2.6) * .08);
  }
  const wx = mx - pmx, wy = my - pmy;
  const windPow = Math.min(Math.hypot(wx, wy), 40);
  pmx = mx; pmy = my;
  const reach = W < 760 ? 3600 : 7000;

  ctx.fillStyle = 'rgba(14,8,31,.34)';
  ctx.fillRect(0, 0, W, H);

  for (const g of grains){
    const dx = g.x - mx, dy = g.y - my;
    const d2 = dx*dx + dy*dy;
    if (d2 < reach && windPow > 2){
      const gust = (reach - d2) / reach;
      g.vx += (wx * .14 + (Math.random()-.5) * 2) * gust;
      g.vy += (wy * .14 + (Math.random()-.5) * 2 - .4) * gust;
      g.flying = 1;
    }
    g.vx += (g.hx - g.x) * .008;
    g.vy += (g.hy - g.y) * .008;
    g.vx *= .94; g.vy *= .94;
    g.x += g.vx; g.y += g.vy;
    g.flying *= .98;
    ctx.globalAlpha = 1 - g.flying * .3;
    ctx.fillStyle = g.c;
    ctx.fillRect(g.x, g.y, g.s, g.s);
  }
  ctx.globalAlpha = 1;
})();

/* the quiet log underneath: what a business never sees */
const CALLS = ['<b>●</b> Missed call · after hours', '<b>●</b> Voicemail · not returned', '<b>●</b> Missed call · on a job', '<b>●</b> Called back · two days later', '<b>●</b> They hired someone else'];
const call = document.getElementById('call');
let ci = 0, ct = null;
function nextCall(){
  call.style.opacity = 0;
  setTimeout(() => { call.innerHTML = CALLS[ci]; call.style.opacity = 1; ci = (ci + 1) % CALLS.length; }, 400);
  ct = setTimeout(nextCall, 2800);
}
SCENE.onFirstEnter(nextCall);
addEventListener('scene:enter', () => { clearTimeout(ct); ci = 0; nextCall(); });
</script>
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(233,161,59,.85); transform:translate(-50%,-50%); }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  dot.style.opacity=ring.style.opacity='0';   /* hidden until the first pointer move, so nothing parks over the copy */
  document.body.append(dot,ring);
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{if(ring.style.opacity){rx=e.clientX;ry=e.clientY;dot.style.opacity=ring.style.opacity='';}mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
})();
</script>
</body>
</html>
