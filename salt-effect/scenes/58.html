<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>The Salt Effect · Rain on glass</title>
<!-- NIGHT BUS · Rain on Glass. Story position 46/76, Chapter V · The signal.
     Looking through a rainy window at night: drops bead and race down, the town's lights drift
     past behind, and the cursor wipes fog that slowly comes back. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:linear-gradient(180deg, var(--ink-1), var(--ink-0));color:var(--lilac);
    font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
  .photo{position:fixed;inset:0;overflow:hidden}
  .photo picture{display:block;width:100%;height:100%}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.8) saturate(1.05)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* lights drift past behind the glass and glow through the fog */
  #bg{mix-blend-mode:screen}
  .shade{position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(14,8,31,.45) 0%, rgba(14,8,31,0) 30%, rgba(14,8,31,0) 50%, rgba(14,8,31,.82) 100%)}
  .title{position:fixed;left:6vw;bottom:10vh;z-index:5;pointer-events:none;max-width:min(760px,88vw)}
  .title h1{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:.98;
    font-size:clamp(38px,5.6vw,82px);color:var(--bone);text-shadow:0 2px 30px rgba(14,8,31,.8);text-wrap:balance}
  .title h1 em{font-style:italic;color:var(--amber-hi)}
  .title p{margin-top:18px;font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:var(--lilac);max-width:38ch;text-shadow:0 1px 16px rgba(14,8,31,.9)}
  .query{margin-top:22px;display:inline-flex;align-items:center;gap:10px;padding:11px 16px 11px 14px;border-radius:999px;
    background:rgba(24,15,47,.62);border:1px solid rgba(179,170,205,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-family:'Space Mono',ui-monospace,monospace;font-size:14px;color:var(--bone);min-width:250px;
    box-shadow:0 0 40px rgba(233,161,59,.12)}
  .query svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--mist);stroke-width:1.8;stroke-linecap:round}
  .query .caret{display:inline-block;width:2px;height:1.05em;background:var(--amber);margin-left:1px;vertical-align:-2px;animation:car 1s steps(2) infinite}
  @keyframes car{50%{opacity:0}}
  .title .hint{display:block;margin-top:16px}
  .hud{position:fixed;z-index:10;text-shadow:0 0 10px rgba(14,8,31,.9)}
  .t1{top:84px;left:32px} .t2{top:84px;right:32px;text-align:right}
  .touch{display:none}
  @media (hover:none){ .fine{display:none} .touch{display:inline} }
  @media (max-width:640px){
    .t1{left:16px;top:80px} .t2{display:none}
    .title{left:16px;right:16px;bottom:44px}
    .query{min-width:0;width:100%}
  }
</style>
</head>
<body>
  <div class="photo"><picture>
    <source media="(max-width:700px)" srcset="../assets/img/window-rain-tall.jpg">
    <img src="../assets/img/window-rain.jpg" onerror="this.style.visibility='hidden'" alt="">
  </picture></div>
  <canvas id="glass" aria-hidden="true"></canvas>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="beads" aria-hidden="true"></canvas>
  <div class="shade"></div>
  <div class="title">
    <h1>Somewhere, right now, a customer is <em>searching.</em></h1>
    <p>Rainy night, phone in hand, typing exactly what you sell.</p>
    <div class="query" aria-label="Example search being typed">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      <span><span id="typed"></span><span class="caret"></span></span>
    </div>
    <span class="mono hint"><span class="fine">Wipe the fog with your cursor · it always comes back</span><span class="touch">Wipe the fog with a finger · it always comes back</span></span>
  </div>
  <span class="mono hud t1">V · The signal — 46/76</span>
  <span class="mono hud t2">Rain · 35.97° N, 83.62° W</span>

<script>
(function(){
  const bg = document.getElementById('bg'), bctx = bg.getContext('2d');
  const gl = document.getElementById('glass'), gctx = gl.getContext('2d');
  const bd = document.getElementById('beads'), dctx = bd.getContext('2d');
  let W, H, DPR;

  /* the town behind the glass: soft lights drifting past (amber windows, lilac/bone streetlights) */
  const CITY = [[233,161,59], [240,176,85], [233,161,59], [179,170,205], [245,243,237]];
  let lights = [];
  function fit(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [bg, gl, bd]){ c.width = W * DPR; c.height = H * DPR; }
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0); gctx.setTransform(DPR, 0, 0, DPR, 0, 0); dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    lights = Array.from({ length: W < 640 ? 26 : 46 }, () => ({
      x: Math.random() * W, y: H * .2 + Math.random() * H * .6,
      r: Math.random() * 46 + 14,
      c: CITY[Math.floor(Math.random() * CITY.length)],
      v: Math.random() * .5 + .12, ph: Math.random() * Math.PI * 2
    }));
    buildFog();
  }

  /* the fog is the same view, blurred and milky; wiping it cuts through to the sharp photo */
  const img = document.querySelector('.photo img');
  const fogSrc = document.createElement('canvas');
  let fogReady = false;
  function buildFog(){
    if (!img || !img.complete || !img.naturalWidth) return;
    fogSrc.width = W; fogSrc.height = H;
    const f = fogSrc.getContext('2d');
    const k = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    const iw = img.naturalWidth * k, ih = img.naturalHeight * k, ix = (W - iw) / 2, iy = (H - ih) / 2;
    if (typeof f.filter === 'string'){
      f.filter = 'blur(14px) brightness(.84)';
      f.drawImage(img, ix - 30, iy - 30, iw + 60, ih + 60);
      f.filter = 'none';
    } else {
      const sm = document.createElement('canvas'); sm.width = Math.ceil(W / 16); sm.height = Math.ceil(H / 16);
      sm.getContext('2d').drawImage(img, ix / 16, iy / 16, iw / 16, ih / 16);
      f.imageSmoothingEnabled = true; f.drawImage(sm, 0, 0, W, H);
    }
    f.fillStyle = 'rgba(179,170,205,.08)'; f.fillRect(0, 0, W, H);
    fogReady = true;
    gctx.clearRect(0, 0, W, H);
    gctx.drawImage(fogSrc, 0, 0, W, H);
  }
  if (img){
    img.addEventListener('load', buildFog);
    img.addEventListener('error', () => { fogReady = false; });
  }
  fit(); addEventListener('resize', fit);

  const drops = [];
  let fogTick = 0;
  let mx = -9999, my = -9999, lastMove = -1e9;
  const setP = e => { mx = e.clientX; my = e.clientY; lastMove = performance.now(); };
  addEventListener('pointermove', setP);
  addEventListener('pointerdown', setP);

  (function loop(){
    requestAnimationFrame(loop);
    const t = performance.now() / 1000;

    /* background lights: transparent canvas over the photo */
    bctx.clearRect(0, 0, W, H);
    bctx.globalCompositeOperation = 'lighter';
    for (const L of lights){
      L.x -= L.v;
      if (L.x < -60) L.x = W + 60;
      const pulse = .75 + Math.sin(L.ph + t * 1.4) * .25;
      const g = bctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
      g.addColorStop(0, `rgba(${L.c[0]},${L.c[1]},${L.c[2]},${.22 * pulse})`);
      g.addColorStop(1, `rgba(${L.c[0]},${L.c[1]},${L.c[2]},0)`);
      bctx.fillStyle = g;
      bctx.beginPath(); bctx.arc(L.x, L.y, L.r, 0, 7); bctx.fill();
    }
    bctx.globalCompositeOperation = 'source-over';

    /* the fog regrows slowly */
    /* in steps big enough to keep the fog's color: tiny alpha steps round the dark tones to black */
    if (fogReady && ++fogTick % 8 === 0){
      gctx.globalAlpha = .05;
      gctx.drawImage(fogSrc, 0, 0, W, H);
      gctx.globalAlpha = 1;
    }
    /* idle: a slow wipe sweeps by itself */
    if (performance.now() - lastMove > 3200){
      mx = W * (.5 + Math.cos(t * .8) * .4);
      my = H * (.4 + Math.sin(t * 1.6) * .2);
    }
    /* the cursor wipes the fog */
    if (mx > -100){
      gctx.save();
      gctx.globalCompositeOperation = 'destination-out';
      const wg = gctx.createRadialGradient(mx, my, 0, mx, my, 85);
      wg.addColorStop(0, performance.now() - lastMove > 3200 ? 'rgba(0,0,0,.26)' : 'rgba(0,0,0,.5)');
      wg.addColorStop(1, 'rgba(0,0,0,0)');
      gctx.fillStyle = wg;
      gctx.beginPath(); gctx.arc(mx, my, 85, 0, 7); gctx.fill();
      gctx.restore();
    }

    /* raindrops: spawn, slide, streak. The streak is cut into the fog; the bead lives on its own layer */
    if (Math.random() < (W < 640 ? .06 : .11)) drops.push({ x: Math.random() * W, y: Math.random() < .5 ? -10 : Math.random() * H * .7, r: Math.random() * 2.4 + 1.2, v: 0 });
    dctx.clearRect(0, 0, W, H);
    gctx.save();
    for (let i = drops.length - 1; i >= 0; i--){
      const d = drops[i];
      d.v += .06 * d.r * .4;
      d.v *= .96;
      d.y += d.v;
      d.x += Math.sin(d.y * .02 + d.r * 7) * .16;
      if (d.y > H + 12){ drops.splice(i, 1); continue; }
      gctx.globalCompositeOperation = 'destination-out';
      gctx.fillStyle = 'rgba(0,0,0,.38)';
      gctx.beginPath(); gctx.arc(d.x, d.y, d.r, 0, 7); gctx.fill();
      dctx.fillStyle = 'rgba(234,231,244,.42)';
      dctx.beginPath(); dctx.ellipse(d.x, d.y, d.r * .8, d.r * (.8 + Math.min(.6, d.v * .15)), 0, 0, 7); dctx.fill();
      dctx.fillStyle = 'rgba(245,243,237,.85)';
      dctx.beginPath(); dctx.arc(d.x - d.r * .25, d.y - d.r * .3, d.r * .28, 0, 7); dctx.fill();
    }
    gctx.restore();
  })();

  /* the search being typed, one query at a time (starts when the visitor arrives) */
  const Q = ['roof leak emergency', 'plumber open now', 'cabin cleaning near me', 'who fixes garage doors'];
  const out = document.getElementById('typed');
  let qi = 0, run = 0;
  function type(){
    const id = ++run, q = Q[qi % Q.length];
    let n = 0;
    out.textContent = '';
    (function step(){
      if (id !== run) return;
      if (n <= q.length){ out.textContent = q.slice(0, n++); setTimeout(step, 70 + Math.random() * 90); }
      else setTimeout(() => { if (id !== run) return; erase(); }, 1900);
    })();
    function erase(){
      (function back(){
        if (id !== run) return;
        if (out.textContent.length){ out.textContent = out.textContent.slice(0, -1); setTimeout(back, 28); }
        else { qi++; setTimeout(type, 450); }
      })();
    }
  }
  SCENE.onFirstEnter(() => setTimeout(type, 600));
})();
</script>

<!-- cursor: the wiping hand (fine pointers only) -->
<style>
@media (hover:hover) and (pointer:fine){
  *{cursor:none !important}
  #wlDot,#wlRing{position:fixed;top:0;left:0;pointer-events:none;z-index:9999}
  #wlDot{width:6px;height:6px;border-radius:50%;background:var(--amber-hi);transform:translate(-50%,-50%)}
  #wlRing{width:85px;height:85px;border-radius:50%;border:1px dashed rgba(234,231,244,.4);transform:translate(-50%,-50%)}
  .wlRipple{position:fixed;pointer-events:none;z-index:9998;width:8px;height:8px;border-radius:50%;border:2px solid var(--lilac);transform:translate(-50%,-50%);animation:wlrip .55s ease-out forwards}
  @keyframes wlrip{to{width:80px;height:80px;opacity:0}}
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot = document.createElement('div'); dot.id = 'wlDot';
  const ring = document.createElement('div'); ring.id = 'wlRing';
  document.body.append(dot, ring);
  let mx = -100, my = -100, rx = mx, ry = my;
  addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; });
  (function f(){ rx += (mx - rx) * .2; ry += (my - ry) * .2; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(f); })();
  addEventListener('mousedown', e => { const r = document.createElement('div'); r.className = 'wlRipple'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 600); });
})();
</script>
</body>
</html>
