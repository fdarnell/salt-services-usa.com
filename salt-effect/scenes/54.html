<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<link rel="icon" href="data:,">
<title>Drop a grain · The Salt Effect</title>
<!-- POND ripple surface, re-cut for The Salt Effect (scene 25/56, opens Chapter IV).
     A surface of dots behaves like still water: waves radiate from the cursor and from clicks
     (real 2D wave propagation). On arrival one salt grain falls into the middle. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  @media (hover:hover) and (pointer:fine){ * { cursor:none; } }
  html,body { height:100%; overflow:hidden; }
  body { background:radial-gradient(120% 80% at 50% 0%, var(--ink-1) 0%, var(--ink-0) 100%); color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif; }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:pan-y; }
  .title { position:fixed; left:50%; top:27%; transform:translate(-50%,-50%); z-index:5; text-align:center; pointer-events:none; width:min(92vw,900px); }
  .title .mono { display:block; margin-bottom:22px; }
  .title h1 { font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:clamp(46px,6.6vw,100px); line-height:.95; letter-spacing:-.02em;
    color:var(--bone); font-variation-settings:'opsz' 144, 'SOFT' 60; text-shadow:0 0 40px rgba(14,8,31,.9); }
  .title h1 span { color:var(--amber); }
  .title p { margin-top:18px; font-size:clamp(17px,1.5vw,21px); color:var(--lilac); text-shadow:0 0 20px rgba(14,8,31,.95); }
  .hud { position:fixed; z-index:10; bottom:26px; }
  .b1{ left:32px; } .b2{ right:32px; text-align:right; }
  .touch { display:none; }
  @media (hover:none) { .touch { display:inline; } .fine { display:none; } }
  @media (max-width:600px){
    .title { top:30%; }
    .hud { bottom:18px; } .b1 { left:16px; } .b2 { display:none; }
  }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="title">
    <span class="mono">IV · The town — 25/56</span>
    <h1>Drop a grain <br>in the <span>water.</span></h1>
    <p>Watch how far it goes.</p>
  </div>
  <span class="mono hud b1 fine">Move across the water · click to drop a grain</span>
  <span class="mono hud b1 touch">Tap the water to drop a grain</span>
  <span class="mono hud b2">Kodak, TN · 35.97° N, 83.62° W</span>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let GAP, W, H, DPR, cols, rows, curr, prev;

function build(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  GAP = W < 600 ? 17 : 22;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cols = Math.ceil(W / GAP) + 1;
  rows = Math.ceil(H / GAP) + 1;
  curr = new Float32Array(cols * rows);
  prev = new Float32Array(cols * rows);
}
build(); addEventListener('resize', build);

function disturb(px, py, power){
  const cx = Math.round(px / GAP), cy = Math.round(py / GAP);
  if (cx > 1 && cx < cols - 1 && cy > 1 && cy < rows - 1)
    prev[cy * cols + cx] -= power;
}

/* falling grains: a little salt cube drops, then the water takes it */
const grains = [];
function dropGrain(x, y, power){
  grains.push({ x, y, ty:y, cy:Math.min(y - H * .5, -20), vy:0, power, rot:Math.random() * 6 });
}

let lastMove = -1e9;
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  disturb(e.clientX, e.clientY, 2.2);
  lastMove = performance.now();
});
addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') disturb(e.clientX, e.clientY, 46);
  else { dropGrain(e.clientX, e.clientY, 46); lastMove = performance.now(); }
});

/* the first grain, when the visitor arrives */
function opening(){ dropGrain(W / 2, H * (W < 600 ? .62 : .64), 120); lastMove = performance.now() - 1200; }
SCENE.onFirstEnter(opening);
addEventListener('scene:enter', () => { if (performance.now() > 4000) opening(); });

/* mist (179,170,205) at rest, amber (233,161,59) at the crest */
const lerp = (a, b, t) => a + (b - a) * t;

(function loop(){
  requestAnimationFrame(loop);
  /* idle raindrops */
  if (performance.now() - lastMove > 2800 && Math.random() < .05)
    disturb(Math.random()*W, Math.random()*H, 26);

  /* classic 2D wave equation */
  for (let y = 1; y < rows - 1; y++){
    for (let x = 1; x < cols - 1; x++){
      const i = y * cols + x;
      curr[i] = ((prev[i-1] + prev[i+1] + prev[i-cols] + prev[i+cols]) / 2 - curr[i]) * .985;
    }
  }
  [curr, prev] = [prev, curr];

  ctx.clearRect(0, 0, W, H);
  for (let y = 1; y < rows - 1; y++){
    for (let x = 1; x < cols - 1; x++){
      const h = prev[y * cols + x];
      const lift = Math.max(-14, Math.min(14, h * 1.4));
      const mag = Math.min(1, Math.abs(h) * .1);
      const px = x * GAP, py = y * GAP - lift;
      const r = lerp(179, 240, mag) | 0, g = lerp(170, 176, mag) | 0, b = lerp(205, 85, mag) | 0;
      ctx.fillStyle = `rgba(${r},${g},${b},${.22 + mag * .78})`;
      ctx.beginPath();
      ctx.arc(px, py, 1.2 + mag * 2.6, 0, 7);
      ctx.fill();
    }
  }

  /* grains in flight */
  for (let i = grains.length - 1; i >= 0; i--){
    const g = grains[i];
    g.vy += 1.1; g.cy += g.vy; g.rot += .12;
    if (g.cy >= g.ty){
      disturb(g.x, g.ty, g.power);
      disturb(g.x + GAP, g.ty, g.power * .3);
      grains.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.translate(g.x, g.cy); ctx.rotate(g.rot);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 22);
    glow.addColorStop(0, 'rgba(240,176,85,.55)'); glow.addColorStop(1, 'rgba(233,161,59,0)');
    ctx.fillStyle = glow; ctx.fillRect(-22, -22, 44, 44);
    ctx.fillStyle = '#f5f3ed'; ctx.fillRect(-3.5, -3.5, 7, 7);
    ctx.restore();
  }
})();
</script>
<!-- signature cursor · matched (amber water) -->
<style>
@media (hover:hover) and (pointer:fine){
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:#e9a13b; transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(233,161,59,.8); transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease; }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid #f0b055; transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring); dot.style.left=dot.style.top=ring.style.left=ring.style.top='-100px';
  let mx=-100,my=-100,rx=mx,ry=my;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
})();
</script>
</body>
</html>
