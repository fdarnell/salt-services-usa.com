<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>The Salt Effect · Unseen</title>
<!-- SIGNAL LOST · Glitch Type. Story position 45/76, Chapter V · The signal.
     RGB-split glitch on the headline: short bursts every few seconds, held while hovered.
     Scanlines and slice displacement, rationed. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(ellipse 80% 60% at 50% 50%, var(--ink-1) 0%, var(--ink-0) 100%);
    color:var(--bone);font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column}
  .mono{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}

  /* scanlines over everything */
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.55;
    background:repeating-linear-gradient(0deg, rgba(14,8,31,0) 0 2px, rgba(14,8,31,.35) 2px 3px)}
  /* a faint screen roll, like an old set losing the station */
  body::before{content:'';position:fixed;left:0;right:0;height:22vh;top:-22vh;pointer-events:none;z-index:49;
    background:linear-gradient(180deg, rgba(179,170,205,0), rgba(179,170,205,.045), rgba(179,170,205,0));
    animation:roll 7s linear infinite}
  @keyframes roll{to{transform:translateY(130vh)}}

  .bar{display:flex;justify-content:space-between;padding:84px 32px 0}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:0 16px 64px}

  .glitch{position:relative;font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:.95;letter-spacing:-.02em}
  #g1{font-size:clamp(30px,4.4vw,62px);color:var(--lilac)}
  #g2{font-size:clamp(50px,9vw,140px);color:var(--bone)}
  #g2 em{font-style:italic;color:var(--amber-hi)}
  .glitch .base{position:relative;z-index:3;display:block}
  .glitch .r,.glitch .c{position:absolute;inset:0;z-index:2;opacity:0}
  .glitch .r{color:var(--amber)}
  .glitch .c{color:var(--mist)}
  .glitch .r em,.glitch .c em{color:inherit;font-style:italic}
  .glitch.on .r{opacity:.85;animation:shiftR .28s steps(3) infinite}
  .glitch.on .c{opacity:.85;animation:shiftC .32s steps(4) infinite}
  .glitch.on .base{animation:slice .3s steps(2) infinite}
  @keyframes shiftR{0%{transform:translate(-5px,2px)}34%{transform:translate(4px,-2px)}67%{transform:translate(-2px,-3px)}100%{transform:translate(5px,2px)}}
  @keyframes shiftC{0%{transform:translate(5px,-2px)}25%{transform:translate(-4px,3px)}50%{transform:translate(3px,2px)}75%{transform:translate(-5px,-1px)}100%{transform:translate(2px,3px)}}
  @keyframes slice{
    0%{clip-path:inset(0 0 0 0)}
    50%{clip-path:polygon(0 0,100% 0,100% 34%,0 34%,0 42%,100% 42%,100% 100%,0 100%);transform:translateX(3px)}
    100%{clip-path:inset(0 0 0 0);transform:none}
  }
  .sub{font-size:clamp(18px,1.6vw,22px);line-height:1.5;color:var(--lilac);margin-top:6px}
  .tagbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .tag{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--ink-2);color:var(--mist);opacity:.75;padding:9px 16px;border-radius:4px}
  .tag.you{border-color:rgba(233,161,59,.6);color:var(--amber);opacity:1}
  .tag.you i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:8px;vertical-align:0;animation:blink 1.4s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}
  #status{transition:color .1s}
  #status.lost{color:var(--amber)}
  @media (max-width:640px){
    .bar{padding:80px 16px 0}
    .tag{padding:8px 11px;font-size:11px}
    .stage{gap:18px}
  }
</style>
</head>
<body>
  <div class="bar"><span class="mono">V · The signal — 45/76</span><span class="mono" id="status">Signal: OK</span></div>

  <div class="stage">
    <div class="glitch" id="g1">
      <span class="base">But great businesses</span>
      <span class="r" aria-hidden="true">But great businesses</span>
      <span class="c" aria-hidden="true">But great businesses</span>
    </div>
    <div class="glitch" id="g2">
      <span class="base">still go <em>unseen.</em></span>
      <span class="r" aria-hidden="true">still go <em>unseen.</em></span>
      <span class="c" aria-hidden="true">still go <em>unseen.</em></span>
    </div>
    <p class="sub">Best in town. Page three of Google.</p>
    <div class="tagbar" aria-label="Search results pages">
      <span class="tag">Page 1</span><span class="tag">Page 2</span><span class="tag you"><i></i>Page 3 · You</span>
    </div>
  </div>

<script>
(function(){
  const glitches = [...document.querySelectorAll('.glitch')];
  const status = document.getElementById('status');
  const lost = () => { status.textContent = 'Signal: lost'; status.classList.add('lost'); };
  const ok = () => { if (!glitches.some(x => x.classList.contains('on'))){ status.textContent = 'Signal: OK'; status.classList.remove('lost'); } };

  /* auto pulse: brief bursts, never constant */
  let held = null, timer = null;
  function pulse(){
    if (!held){
      const g = glitches[Math.random() < .65 ? 1 : 0];
      g.classList.add('on'); lost();
      setTimeout(() => { if (held !== g) g.classList.remove('on'); ok(); }, 240 + Math.random() * 360);
    }
    timer = setTimeout(pulse, 1400 + Math.random() * 2600);
  }
  SCENE.onFirstEnter(() => { timer = setTimeout(pulse, 500); });

  /* hover holds the storm; a tap gives it a longer burst */
  glitches.forEach(g => {
    g.addEventListener('mouseenter', () => { held = g; g.classList.add('on'); lost(); });
    g.addEventListener('mouseleave', () => { held = null; g.classList.remove('on'); ok(); });
    g.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      g.classList.add('on'); lost();
      setTimeout(() => { g.classList.remove('on'); ok(); }, 900);
    });
  });
})();
</script>

<!-- cursor (fine pointers only) -->
<style>
@media (hover:hover) and (pointer:fine){
  *{cursor:none !important}
  #wlDot,#wlRing{position:fixed;top:0;left:0;pointer-events:none;z-index:9999}
  #wlDot{width:6px;height:6px;border-radius:50%;background:var(--amber-hi);transform:translate(-50%,-50%)}
  #wlRing{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(179,170,205,.8);transform:translate(-50%,-50%);transition:width .25s ease,height .25s ease}
  .wlRipple{position:fixed;pointer-events:none;z-index:9998;width:8px;height:8px;border-radius:50%;border:2px solid var(--amber);transform:translate(-50%,-50%);animation:wlrip .55s ease-out forwards}
  @keyframes wlrip{to{width:70px;height:70px;opacity:0}}
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot = document.createElement('div'); dot.id = 'wlDot';
  const ring = document.createElement('div'); ring.id = 'wlRing';
  document.body.append(dot, ring);
  let mx = -100, my = -100, rx = mx, ry = my;
  addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; });
  (function f(){ rx += (mx - rx) * .16; ry += (my - ry) * .16; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(f); })();
  addEventListener('mousedown', e => { const r = document.createElement('div'); r.className = 'wlRipple'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 600); });
  document.body.addEventListener('mouseover', e => {
    const hit = e.target.closest('.glitch');
    ring.style.width = hit ? '60px' : '36px'; ring.style.height = hit ? '60px' : '36px';
  });
})();
</script>
</body>
</html>
