<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<link rel="icon" href="data:,">
<title>Drag down Main Street · The Salt Effect</title>
<!-- 22/56 · III The street · effect: Inertia Drag Carousel (template 36).
     Grab and throw the row of shops: momentum, velocity skew, rubber-band edges.
     Inside the story, scrolling past nudges it (scene:progress); on its own page the wheel does. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0;
    --lilac:#eae7f4; --mist:#b3aacd; --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--ink-0); color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif; display:flex; flex-direction:column; }
  /* street lamps along the bottom edge */
  body::before { content:''; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(80vw 30vh at 50% 100%, rgba(233,161,59,.12), transparent 70%), linear-gradient(var(--ink-1), var(--ink-0)); }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }

  header { position:relative; display:flex; justify-content:space-between; align-items:flex-end; gap:20px; padding:96px 40px 8px; }
  header h1 { font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:clamp(34px,4.2vw,62px); line-height:.95; letter-spacing:-.02em; font-variation-settings:"opsz" 144, "SOFT" 30; }
  header h1 em { font-style:italic; font-weight:500; color:var(--amber); white-space:nowrap; }
  header .mono:first-child { display:block; margin-bottom:14px; }

  .viewport { position:relative; flex:1; min-height:0; display:flex; align-items:center; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:pan-y; cursor:grab; }
  .viewport.grab { cursor:grabbing; }
  #belt { display:flex; gap:26px; padding:0 6vw; will-change:transform; }
  .slide { flex:0 0 auto; width:min(380px, 66vw, calc((100vh - 280px) * .8)); }
  .shot { overflow:hidden; border-radius:8px; aspect-ratio:4/5; position:relative;
    background:radial-gradient(90% 70% at 60% 30%, rgba(233,161,59,.22), transparent 65%), linear-gradient(170deg, var(--ink-2), var(--ink-1));
    box-shadow:0 30px 60px -30px rgba(0,0,0,.8); }
  .shot img { width:100%; height:100%; object-fit:cover; pointer-events:none; transform:scale(1.06); transition:transform .6s; }
  .slide:hover .shot img { transform:scale(1.12); }
  .shot .no { position:absolute; top:12px; left:14px; font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; color:var(--lilac);
    background:rgba(14,8,31,.55); padding:5px 9px; border-radius:999px; }
  .meta { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:14px; }
  .meta .name { font-family:'Fraunces',Georgia,serif; font-weight:540; font-size:clamp(22px,1.9vw,27px); letter-spacing:-.02em; line-height:1.05; color:var(--bone); }
  .meta .mono { white-space:nowrap; }

  .rails { position:relative; padding:0 40px 26px; display:flex; justify-content:space-between; align-items:center; gap:30px; }
  .track { flex:1; height:1px; background:var(--ink-2); position:relative; }
  .track i { position:absolute; top:-1px; left:0; height:3px; width:12%; background:var(--amber); border-radius:3px; box-shadow:0 0 10px rgba(233,161,59,.6); }
  @media (max-width:700px){
    header { padding:88px 20px 4px; } header > .mono { display:none; }
    #belt { gap:16px; }
    .rails { padding:0 20px 20px; gap:16px; } .rails .mono:last-child { display:none; }
  }
</style>
</head>
<body>
  <header>
    <div><span class="mono">III · The street — 22/56</span><h1>Drag down <em>Main Street.</em></h1></div>
    <span class="mono" id="hint">Grab it, throw it. It keeps rolling.</span>
  </header>

  <div class="viewport" id="vp"><div id="belt"></div></div>

  <div class="rails">
    <span class="mono">6 doors</span>
    <div class="track"><i id="prog"></i></div>
    <span class="mono">Kodak, TN · 35.97° N, 83.62° W</span>
  </div>

<script>
const SLIDES = [
  { img:'counter',         name:'Open at six',        tag:'The bakery' },
  { img:'main-street-lit', name:'Open late Fridays',  tag:'The diner' },
  { img:'workshop',        name:'Here since forever', tag:'Hardware' },
  { img:'shop-dusk',       name:'New this spring',    tag:'The florist' },
  { img:'town-ridge',      name:'Family run',         tag:'The roofer' },
  { img:'market-lights',   name:'Locally made',       tag:'The market' }
];
const belt = document.getElementById('belt');
SLIDES.forEach((s, i) => {
  belt.insertAdjacentHTML('beforeend',
    `<div class="slide"><div class="shot"><img draggable="false" alt="" src="../assets/img/${s.img}-tall.jpg"><span class="no">${String(i + 1).padStart(2, '0')}</span></div>
     <div class="meta"><span class="name">${s.name}</span><span class="mono">${s.tag}</span></div></div>`);
});
belt.querySelectorAll('img').forEach(i => i.addEventListener('error', () => i.style.visibility = 'hidden'));
if (matchMedia('(hover:none)').matches) document.getElementById('hint').textContent = 'Swipe it sideways';

let x = 0, vx = 0, dragging = false, lastX = 0, max = 0, drift = 1, alive = !SCENE.embedded;
function measure(){ max = Math.max(0, belt.scrollWidth - innerWidth); }
measure(); addEventListener('resize', measure);
addEventListener('load', measure);

/* drag with mouse, pen or finger (vertical swipes still scroll the page on phones) */
const vp = document.getElementById('vp');
let pid = null;
vp.addEventListener('pointerdown', e => { dragging = true; pid = e.pointerId; lastX = e.clientX; vp.classList.add('grab'); });
addEventListener('pointermove', e => { if (dragging && e.pointerId === pid){ vx = -(e.clientX - lastX) * 1.15; lastX = e.clientX; x += vx; } });
const release = () => { dragging = false; pid = null; vp.classList.remove('grab'); };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

/* the wheel belongs to the story when embedded: there, the story scroll nudges the belt */
if (!SCENE.embedded) addEventListener('wheel', e => vx += e.deltaY * .35, { passive:true });
let lastP = null;
addEventListener('scene:progress', e => {
  const p = e.detail.p;
  if (lastP !== null) vx += (p - lastP) * max * .06;
  lastP = p;
});
SCENE.onFirstEnter(() => alive = true);

const prog = document.getElementById('prog');
(function loop(){
  requestAnimationFrame(loop);
  if (!dragging){
    x += vx;
    vx *= .95;                                 /* momentum decay */
    if (alive){
      /* idle drift keeps it rolling, turning round at either end */
      if (x >= max - 4) drift = -1; else if (x <= 4) drift = 1;
      vx += .18 * drift;
    }
  }
  if (x < 0){ x += (0 - x) * .12; vx *= .7; }
  if (x > max){ x += (max - x) * .12; vx *= .7; }
  belt.style.transform = `translateX(${-x}px) skewX(${Math.max(-6, Math.min(6, -vx * .12))}deg)`;
  prog.style.left = (max ? Math.max(0, Math.min(88, (x / max) * 88)) : 0) + '%';
})();
</script>
<!-- signature cursor, amber -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(233,161,59,.85); transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease; }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring);
  let mx=-100,my=-100,rx=mx,ry=my;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
  document.body.addEventListener('mouseover',e=>{
    const hit = e.target.closest('.slide,a,button');
    ring.style.width = hit ? '60px' : '36px'; ring.style.height = hit ? '60px' : '36px';
  });
})();
</script>
</body>
</html>
