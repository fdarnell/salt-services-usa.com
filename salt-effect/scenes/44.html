<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>The Salt Effect · One speck in a very big dark</title>
<!-- Scene 3/76 · from template 44 WARP Starfield.
     A field of salt-white specks idles at cruise and jumps to warp when the story scrolls (scene:progress)
     or when you hold the mouse / a finger down. Opened alone, the mouse wheel feeds it too. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0;
    --lilac:#eae7f4; --mist:#b3aacd; --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--ink-0); color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:pan-y; }
  .glow { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(50% 40% at 50% 50%, rgba(43,29,82,.55), transparent 70%); }
  .calm { position:fixed; inset:0; z-index:4; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse 46% 32% at 50% 50%, rgba(14,8,31,.92) 30%, rgba(14,8,31,.6) 60%, transparent 100%); }
  .hud { text-shadow:0 0 10px var(--ink-0), 0 0 4px var(--ink-0); }
  .center { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; pointer-events:none; padding:72px 24px 60px; }
  h1 { font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(42px,6.4vw,96px); line-height:.98; letter-spacing:-.02em;
    color:var(--bone); max-width:13.5em; text-shadow:0 0 50px rgba(14,8,31,.9), 0 0 80px rgba(233,161,59,.12); }
  h1 em { font-style:italic; font-weight:500; color:var(--amber); }
  .center p { margin-top:26px; max-width:30em; font-size:18px; line-height:1.55; color:var(--lilac); text-shadow:0 0 24px rgba(14,8,31,.95); }
  .hud { position:fixed; z-index:10; }
  .t1{ top:88px; left:32px; } .t2{ top:88px; right:32px; text-align:right; }
  .b1{ bottom:26px; left:32px; } .b2{ bottom:26px; right:32px; }
  #speedo { font-variant-numeric:tabular-nums; color:var(--amber); }
  #speedo small { font-size:inherit; color:var(--mist); }
  @media (max-width:640px){
    .t1{ left:20px } .t2{ right:20px } .b1{ left:20px } .b2{ display:none }
    h1 { font-size:clamp(38px,11vw,52px); }
    .center p { font-size:17px; }
  }
</style>
</head>
<body>
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="glow"></div>
  <div class="calm" id="calm"></div>
  <div class="center">
    <h1>Every business starts as one <em>speck</em> in a very big dark.</h1>
    <p>No sign yet. No customers. Just an idea somebody can't stop thinking about.</p>
  </div>
  <span class="mono hud t1">I · The grain — 3/76</span>
  <span class="mono hud t2"><small>Speed </small><span id="speedo">0.03</span></span>
  <span class="mono hud b1" id="hint">Hold anywhere to go faster</span>
  <span class="mono hud b2">35.97° N, 83.62° W</span>

<script>
/* ================= settings ================= */
const STAR_COUNT = innerWidth < 640 ? 1300 : 2400;
const SALT  = [245, 243, 237];   /* --bone */
const AMBER = [240, 176, 85];    /* --amber-hi */
const TRAIL = '14,8,31';         /* --ink-0 */

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H, CX, CY, DPR;
const fit = () => {
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight; CX = W/2; CY = H/2;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = `rgb(${TRAIL})`; ctx.fillRect(0, 0, W, H);
};
fit(); addEventListener('resize', fit);

const stars = Array.from({ length: STAR_COUNT }, () => ({
  x:(Math.random()-.5)*W*2, y:(Math.random()-.5)*H*2, z:Math.random()*1000+1, a:Math.random() < .06
}));

const MAX = 58;
let speed = 2, targetSpeed = 2, held = false;
/* hold: mouse or finger */
addEventListener('pointerdown', () => held = true);
addEventListener('pointerup', () => held = false);
addEventListener('pointercancel', () => held = false);
addEventListener('blur', () => held = false);
document.addEventListener('contextmenu', e => e.preventDefault());

/* the story scroll feeds the engine: speed follows how fast the visitor scrolls */
let lastP = null;
addEventListener('scene:progress', e => {
  const p = e.detail.p;
  if (lastP !== null) targetSpeed = Math.min(60, targetSpeed + Math.abs(p - lastP) * 260);
  lastP = p;
});
/* opened on its own: the wheel feeds it, as in the original */
if (!SCENE.embedded) addEventListener('wheel', e => targetSpeed = Math.min(60, targetSpeed + Math.abs(e.deltaY) * .05), { passive:true });

const mouse = { x:0, y:0 };
addEventListener('mousemove', e => { mouse.x = (e.clientX/W - .5); mouse.y = (e.clientY/H - .5); });

const speedo = document.getElementById('speedo'), calm = document.getElementById('calm');
let shown = '';
(function loop(){
  requestAnimationFrame(loop);
  targetSpeed = held ? MAX : Math.max(2, targetSpeed * .965);
  speed += (targetSpeed - speed) * .06;
  const s = (speed / MAX).toFixed(2);
  if (s !== shown) { speedo.textContent = s; shown = s; calm.style.opacity = Math.min(1, speed / MAX * 1.4).toFixed(3); }

  /* trail fade, heavier at speed for streak persistence */
  ctx.fillStyle = `rgba(${TRAIL},${Math.max(.18, .5 - speed * .006)})`;
  ctx.fillRect(0, 0, W, H);

  const drift = 60, cx = CX + mouse.x * drift, cy = CY + mouse.y * drift;
  for (const st of stars){
    const pz = st.z;
    st.z -= speed;
    if (st.z < 1){ st.z = 1000; st.x = (Math.random()-.5)*W*2; st.y = (Math.random()-.5)*H*2; continue; }
    const x  = cx + st.x / st.z * 420;
    const y  = cy + st.y / st.z * 420;
    if (x < 0 || x > W || y < 0 || y > H) continue;
    const px = cx + st.x / pz * 420;
    const py = cy + st.y / pz * 420;
    const b = Math.min(1, (1000 - st.z) / 700);
    const c = st.a ? AMBER : SALT;
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${b})`;
    ctx.lineWidth = b * (st.a ? 2.8 : 2.2);
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x + .01, y); ctx.stroke();
  }
})();

/* the hint changes once the visitor has felt it */
let hinted = false;
addEventListener('pointerdown', () => { if (!hinted) { hinted = true; document.getElementById('hint').textContent = 'Let go to drift'; } });
addEventListener('pointerup', () => { if (hinted) document.getElementById('hint').textContent = 'Hold anywhere to go faster'; });
</script>
<!-- signature cursor, brand colours, off on touch -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; opacity:0; transition:opacity .2s; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(233,161,59,.8); transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease, opacity .2s; }
  .cur-on #wlDot, .cur-on #wlRing { opacity:1; }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring);
  const R=document.documentElement;
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';R.classList.add('cur-on');});
  document.addEventListener('mouseleave',()=>R.classList.remove('cur-on'));
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
})();
</script>
</body>
</html>
