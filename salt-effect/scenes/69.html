<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<link rel="icon" href="data:,">
<title>How we work · The Salt Effect</title>
<!-- 23/76 · III The street · effect: Testimonial Orbit (template 69).
     Five moons orbit the active line; the front one docks and speaks. Click any moon to summon it.
     Repurposed: Salt's own five working rules instead of reviews. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0;
    --lilac:#eae7f4; --mist:#b3aacd; --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--ink-1); color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; }
  /* the lamp: a warm pool in the middle of the room, the quote sits in it */
  body::before { content:''; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(42vmin 34vmin at 50% 54%, rgba(233,161,59,.16), transparent 70%),
      radial-gradient(120vmax 90vmax at 50% 50%, transparent 40%, var(--ink-0) 100%); }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }

  .title { position:fixed; top:96px; left:0; right:0; text-align:center; z-index:30; pointer-events:none; }
  .title h2 { font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:clamp(34px,4vw,54px); line-height:.95; letter-spacing:-.02em; font-variation-settings:"opsz" 144, "SOFT" 40; }
  .title h2 em { font-style:italic; font-weight:500; color:var(--amber); }
  .title .mono { display:block; margin-bottom:14px; }

  .system { position:relative; width:min(760px,92vw); height:min(560px,80vh); display:flex; align-items:center; justify-content:center; margin-top:76px; }
  #ring { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    border:1px dashed rgba(179,170,205,.28); border-radius:50%; }

  .quotebox { position:relative; z-index:15; text-align:center; max-width:460px; padding:0 20px; }
  .quotebox q { font-family:'Fraunces',Georgia,serif; font-weight:500; font-size:clamp(28px,3.4vw,48px); line-height:1.06; letter-spacing:-.02em; quotes:none;
    font-variation-settings:"opsz" 96, "SOFT" 60;
    display:flex; align-items:center; justify-content:center; min-height:3.3em; transition:opacity .35s, transform .35s; }
  .quotebox q.swap { opacity:0; transform:translateY(10px); }
  .who { margin-top:18px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .who b { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:500; color:var(--lilac); }
  .who b svg { width:14px; height:14px; }

  .moon { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-family:'Space Mono',ui-monospace,monospace; font-size:14px; color:var(--lilac);
    cursor:pointer; will-change:transform; transition:box-shadow .4s, border-color .4s, color .4s, background .4s;
    border:1.5px solid rgba(179,170,205,.3); background:radial-gradient(circle at 35% 30%, rgba(179,170,205,.22), transparent 55%), radial-gradient(circle at 50% 50%, var(--ink-2) 55%, var(--ink-1)); }
  .moon.on { color:var(--ink-0); border-color:var(--amber-hi);
    background:radial-gradient(circle at 38% 32%, rgba(245,243,237,.65), transparent 42%), radial-gradient(circle, var(--amber-hi) 35%, var(--amber) 80%);
    box-shadow:0 0 0 6px rgba(233,161,59,.18), 0 0 44px rgba(233,161,59,.45); }
  .hud { position:fixed; z-index:10; }
  .b1{ bottom:26px; left:32px; } .b2{ bottom:26px; right:32px; }
  @media (max-width:640px){
    .title { top:84px; padding:0 20px; }
    .system { margin-top:120px; height:min(620px,74vh); }
    .quotebox { max-width:250px; padding:0; }
    .quotebox q { font-size:27px; min-height:4.4em; }
    .hud { font-size:11px; } .b1{ left:20px; bottom:20px; } .b2{ display:none; }
  }
  @media (max-height:700px) and (min-width:641px){ .title{ top:80px; } .title .mono{ display:none; } }
</style>
</head>
<body>
  <div class="title">
    <span class="mono">III · The street — 23/76</span>
    <h2>How we <em>work</em></h2>
  </div>
  <span class="mono hud b1" id="hint">Click a moon. It docks and speaks.</span>
  <span class="mono hud b2">Kodak, TN · 35.97° N, 83.62° W</span>

  <div class="system">
    <div id="ring"></div>
    <div class="quotebox">
      <q id="quote"></q>
      <div class="who"><b><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0 9.6 6.4 16 8 9.6 9.6 8 16 6.4 9.6 0 8 6.4 6.4Z" fill="#e9a13b"/></svg>Salt Services, how we work</b><span class="mono" id="role"></span></div>
    </div>
  </div>

<script>
const RULES = [
  'Answer every call.',
  'Show the price.',
  'If it’s wrong, make it right.',
  'Tell people plainly when the budget won’t work.',
  'Never hand an account down to whoever’s newest.'
];
if (matchMedia('(hover:none)').matches) document.getElementById('hint').textContent = 'Tap a moon. It docks and speaks.';

const system = document.querySelector('.system');
const moons = RULES.map((r, i) => {
  const m = document.createElement('button');
  m.className = 'moon';
  m.type = 'button';
  m.setAttribute('aria-label', 'Rule ' + (i + 1) + ': ' + r);
  m.textContent = String(i + 1).padStart(2, '0');
  m.addEventListener('click', () => { setActive(i); lastAct = performance.now(); });
  system.appendChild(m);
  return m;
});

let active = 0, lastAct = 0;
function setActive(i){
  active = i;
  moons.forEach((m, j) => m.classList.toggle('on', j === i));
  const q = document.getElementById('quote');
  q.classList.add('swap');
  setTimeout(() => {
    q.textContent = RULES[i];
    document.getElementById('role').textContent = 'Rule ' + (i + 1) + ' of ' + RULES.length;
    q.classList.remove('swap');
  }, 340);
}
setActive(0);
/* the rotation starts with rule 1 when the visitor arrives */
SCENE.onFirstEnter(() => { lastAct = performance.now(); setActive(0); });
setInterval(() => { if (performance.now() - lastAct > 4200) setActive((active + 1) % RULES.length); }, 3600);

moons.forEach(m => { m.__x = 0; m.__y = 0; m.__s = 1; });
const ring = document.getElementById('ring');
let baseAngle = -Math.PI / 2;

(function loop(){
  requestAnimationFrame(loop);
  baseAngle += .0028;
  const portrait = innerHeight > innerWidth * 1.2;
  /* landscape: a wide flat ellipse; portrait (phones): a tall one, so the moons pass beside the text */
  const R = portrait ? Math.min(innerWidth * .41, 250) : Math.min(250, Math.min(innerWidth, innerHeight) * .36);
  const RY = portrait ? Math.min(R * 1.45, system.clientHeight * .4) : R * .74;
  ring.style.width  = R * 2 + 'px';
  ring.style.height = RY * 2 + 'px';

  moons.forEach((m, i) => {
    const isOn = i === active;
    let tx, ty, ts;
    if (isOn){
      tx = 0;
      ty = -RY - 26 + Math.sin(performance.now() / 700) * 4;
      ts = 1.28;
    } else {
      const others = RULES.length - 1;
      const slot = i < active ? i : i - 1;
      const a = baseAngle + Math.PI / 2 + ((slot + 1) / (others + 1)) * Math.PI * 2;
      tx = Math.cos(a) * R;
      ty = Math.sin(a) * RY;
      ts = .86 + ((ty / RY) + 1) * .12;
    }
    m.__x += (tx - m.__x) * .08;
    m.__y += (ty - m.__y) * .08;
    m.__s += (ts - m.__s) * .08;
    m.style.transform = `translate(${m.__x}px, ${m.__y}px) scale(${m.__s})`;
    m.style.zIndex = isOn ? 20 : Math.round(12 + (m.__y / RY) * 5);
    m.style.opacity = isOn ? 1 : .62 + ((m.__y / RY) + 1) * .17;
  });
})();
</script>
<!-- signature cursor, amber -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(233,161,59,.8); transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease; }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring);
  let mx=-100,my=-100,rx=mx,ry=my;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
  document.body.addEventListener('mouseover',e=>{
    const hit = e.target.closest('a,button,.moon');
    ring.style.width = hit ? '60px' : '36px'; ring.style.height = hit ? '60px' : '36px';
  });
})();
</script>
</body>
</html>
