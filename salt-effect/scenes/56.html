<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<script src="_bridge.js"></script>
<title>It comes back around · Salt Services</title>
<!-- EMERGE · particle image reveal. Main Street exists as drifting salt dust until a brush sweeps it
     into place; wherever it passes, the picture assembles. Click (or tap) scatters it again. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--ink-0); color:var(--bone); font-family:'Instrument Sans',system-ui,sans-serif; }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  .copy { position:fixed; z-index:10; left:40px; bottom:40px; max-width:min(34vw,440px); pointer-events:none; }
  .copy .mono { display:block; margin-bottom:16px; }
  .copy h1 { font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:clamp(40px,4.6vw,72px); line-height:.95; letter-spacing:-.02em; }
  .copy h1 em { font-style:italic; font-weight:500; color:var(--amber); }
  .copy p { margin-top:18px; font-size:17px; line-height:1.55; color:var(--mist); }
  .hint { position:fixed; z-index:10; right:40px; bottom:40px; text-align:right; }
  .copy > * { opacity:0; transform:translateY(16px); transition:opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
  .go .copy > * { opacity:1; transform:none; }
  .go .copy > :nth-child(2) { transition-delay:.15s; } .go .copy > :nth-child(3) { transition-delay:.3s; }
  @media (max-width:700px){
    .copy { left:20px; right:20px; bottom:64px; max-width:none; }
    .copy h1 { font-size:42px; }
    .hint { left:20px; right:auto; bottom:26px; text-align:left; }
  }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="copy">
    <span class="mono">VI · The world — 45/56</span>
    <h1>And it comes back <em>around.</em></h1>
    <p>What you put into a town finds its way back to your door.</p>
  </div>
  <span class="mono hint" id="hint">Brush the dust · click to scatter</span>

<script>
const narrow = innerWidth / innerHeight < .8;
const IMAGE_URL = narrow ? '../assets/img/main-street-lit-tall.jpg' : '../assets/img/main-street-lit.jpg';
const DPR = Math.min(devicePixelRatio || 1, 2);
let GAP, BRUSH;                /* sample spacing and brush radius, in css px */

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H, parts = [], box = { x:0, y:0, w:0, h:0 };
const fit = () => { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); };
fit();
if (SCENE.reduce) document.getElementById('hint').textContent = 'Main Street, every grain home';
else if (matchMedia('(hover:none)').matches) document.getElementById('hint').textContent = 'Tap to scatter it again';

/* where the picture sits: right of the copy on wide screens, above it on phones */
function layout(img){
  const ar = img.width / img.height;
  let bw, bh, cx, cy;
  if (narrow) { bw = W * .9; bh = H * .5; cx = W / 2; cy = H * .36; }
  else { bw = W * .56; bh = H * .74; cx = W * .66; cy = H * .5; }
  let w = bw, h = w / ar; if (h > bh) { h = bh; w = h * ar; }
  box = { x:cx - w/2, y:cy - h/2, w, h };
  GAP = Math.max(4, Math.round(Math.sqrt(w * h / (narrow ? 9000 : 26000))));
  BRUSH = Math.max(70, Math.min(w, h) * .2);
}

let found = 0;
const img = new Image();
img.src = IMAGE_URL;
img.onload = build;
function build(){
  layout(img);
  const iw = Math.floor(box.w), ih = Math.floor(box.h);
  const off = document.createElement('canvas'); off.width = iw; off.height = ih;
  const o = off.getContext('2d');
  o.drawImage(img, 0, 0, iw, ih);
  const data = o.getImageData(0, 0, iw, ih).data;
  parts = []; found = 0;
  for (let y = 0; y < ih; y += GAP) for (let x = 0; x < iw; x += GAP){
    const i = (y * iw + x) * 4;
    const r = data[i], g = data[i+1], b = data[i+2], lum = (r*.3 + g*.59 + b*.11) / 255;
    /* loose, every grain is salt-white, or amber where the windows glow */
    const warm = r - b > 30 && lum > .3;
    parts.push({ hx: box.x + x, hy: box.y + y, x: Math.random()*W, y: Math.random()*H, vx: 0, vy: 0,
      c: `rgb(${r},${g},${b})`, d: warm ? '#f0b055' : '#f5f3ed', a: .18 + lum * .5, found: false });
  }
  /* reduced motion: the picture is simply there, every grain home */
  if (SCENE.reduce) {
    parts.forEach(p => { p.x = p.hx; p.y = p.hy; p.found = true; });
    found = parts.length;
    if (SCENE.thaw) SCENE.thaw(400, false);
  }
}
addEventListener('resize', () => { fit(); if (img.complete && img.naturalWidth) build(); });

/* the brush: the visitor's cursor or finger, and on its own a loop that circles back around the picture */
let mx = -9999, my = -9999, lastMove = -1e9, auto = false, autoT0 = 0;
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; lastMove = performance.now(); });
function scatter(){
  if (SCENE.reduce) return;
  found = 0;
  parts.forEach(p => { p.found = false; p.vx += (Math.random()-.5)*18; p.vy += (Math.random()-.5)*18; });
  autoT0 = performance.now();
}
addEventListener('click', scatter);
SCENE.onFirstEnter(() => { auto = true; autoT0 = performance.now(); document.body.classList.add('go'); });
addEventListener('scene:enter', () => { running = true; if (!auto) return; if (found < parts.length * .5) autoT0 = performance.now(); });
addEventListener('scene:leave', () => { running = false; if (auto) scatter(); });
addEventListener('scene:progress', () => running = true);
let running = true;

(function loop(){
  requestAnimationFrame(loop);
  if (!running) return;
  const now = performance.now();
  /* idle: the brush comes back around, a widening spiral from the middle of the picture */
  if (auto && now - lastMove > 2600){
    const t = (now - autoT0) / 1000, cx = box.x + box.w/2, cy = box.y + box.h/2;
    const k = Math.min(1.45, .12 + t * .13), a = t * 2.4;
    mx = cx + Math.cos(a) * box.w * .5 * k;
    my = cy + Math.sin(a) * box.h * .5 * k;
  }
  ctx.fillStyle = 'rgba(14,8,31,.3)';
  ctx.fillRect(0, 0, W, H);
  const B2 = BRUSH * BRUSH;
  for (const p of parts){
    if (!p.found){
      p.vx += (Math.random()-.5)*.16;
      p.vy += (Math.random()-.5)*.16;
      const bx = p.hx - mx, by = p.hy - my;
      if (bx*bx + by*by < B2) { p.found = true; found++; }
    } else {
      p.vx += (p.hx - p.x) * .07;
      p.vy += (p.hy - p.y) * .07;
    }
    p.vx *= .88; p.vy *= .88;
    p.x += p.vx; p.y += p.vy;
    if (!p.found) {                 /* only loose dust wraps; a grain flying home must never jump edges */
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    }
    if (p.found) { ctx.globalAlpha = 1; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, GAP - .6, GAP - .6); }
    else { ctx.globalAlpha = p.a; ctx.fillStyle = p.d; ctx.fillRect(p.x, p.y, 1.7, 1.7); }
  }
  ctx.globalAlpha = 1;
})();
</script>
<!-- signature cursor: a soft brush ring (fine pointers only) -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; opacity:0; transition:opacity .3s; }
  .cur-on #wlDot,.cur-on #wlRing{ opacity:1; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
  #wlRing{ width:120px; height:120px; border-radius:50%; border:1px dashed rgba(233,161,59,.55); transform:translate(-50%,-50%); }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:90px; height:90px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring);
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{document.body.classList.add('cur-on');mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';
    const s=(typeof BRUSH==='number'?BRUSH*2:120)+'px';ring.style.width=s;ring.style.height=s;});
  (function f(){rx+=(mx-rx)*.2;ry+=(my-ry)*.2;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
})();
</script>
</body>
</html>
