<!DOCTYPE html>
<html lang="en" data-scene="scroll">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<link rel="icon" href="data:,">
<title>Change the world · The Salt Effect</title>
<!-- No. 64 INKWELL Outline Fill Scroll, re-skinned: hollow Fraunces lines fill with ink exactly as
     far as you've scrolled. Scroll scene (~300vh), driven by native window scroll. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:var(--ink-1); }
  body { background:radial-gradient(120% 60% at 50% 100%, var(--ink-2) 0%, transparent 60%), var(--ink-1);
    color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif; overflow-x:hidden; }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }

  .hud { position:fixed; z-index:20; bottom:26px; pointer-events:none; }
  .hud.l { left:32px; } .hud.r { right:32px; }
  .hud b { font-weight:400; color:var(--amber); }

  .intro, .outro { height:88vh; display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:0 20px; }
  .intro .arrow { width:1px; height:56px; background:linear-gradient(var(--mist), transparent); }
  .drop { width:10px; height:10px; border-radius:50%; background:var(--amber-hi);
    box-shadow:0 0 18px 6px rgba(233,161,59,.45), 0 0 80px 30px rgba(233,161,59,.12); }

  .wall { padding:12vh 6vw; display:flex; flex-direction:column; gap:8vh; }
  .fill-line { position:relative; font-family:'Fraunces',Georgia,serif; font-weight:600;
    font-size:clamp(56px,22vw,184px); line-height:1.08; letter-spacing:-.02em;
    width:max-content; max-width:100%; white-space:nowrap; }
  .fill-line .ghost { color:transparent; -webkit-text-stroke:1.3px rgba(179,170,205,.34); }
  .fill-line .ink { position:absolute; inset:0; color:var(--ink,var(--bone)); overflow:hidden; width:0%; white-space:nowrap; }
  /* the wet edge of the ink, riding the fill line */
  .fill-line .ink::after { content:''; position:absolute; top:12%; bottom:6%; right:0; width:2px;
    background:linear-gradient(transparent, var(--amber-hi), transparent); opacity:var(--e,0);
    box-shadow:0 0 14px 2px rgba(233,161,59,.5); transition:opacity .3s; }
  .fill-line:nth-child(2) { align-self:flex-end; }
  .fill-line:nth-child(4) { align-self:flex-end; --ink:var(--amber); }

  @media (pointer:fine){
    * { cursor:none !important; }
    #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; }
    #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
    #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(233,161,59,.85); transform:translate(-50%,-50%); }
    .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
    @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
  }
  @media (max-width:640px){
    .hud.l { left:16px; bottom:20px; } .hud.r { right:16px; bottom:20px; }
    .wall { padding:10vh 16px; gap:7vh; }
  }
</style>
</head>
<body>
  <div class="intro">
    <span class="mono">VI · The world — 67/76</span>
    <span class="mono">Scroll. The ink follows.</span>
    <span class="arrow" aria-hidden="true"></span>
  </div>

  <h2 class="wall" id="wall" aria-label="Change the world around you.">
    <span class="fill-line" aria-hidden="true"><span class="ghost">Change</span><span class="ink">Change</span></span>
    <span class="fill-line" aria-hidden="true"><span class="ghost">the world</span><span class="ink">the world</span></span>
    <span class="fill-line" aria-hidden="true"><span class="ghost">around</span><span class="ink">around</span></span>
    <span class="fill-line" aria-hidden="true"><span class="ghost">you.</span><span class="ink">you.</span></span>
  </h2>

  <div class="outro">
    <span class="drop" aria-hidden="true"></span>
    <span class="mono">Fully inked</span>
  </div>

  <span class="mono hud l"><b id="pct">0%</b> inked</span>
  <span class="mono hud r">35.97° N, 83.62° W</span>

<script>
const lines = [...document.querySelectorAll('.fill-line')];
const pct = document.getElementById('pct');
function measure(){
  /* each line fills across its own window of the viewport */
  lines.forEach(l => {
    const r = l.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (innerHeight * .8 - r.top) / (innerHeight * .55)));
    const ink = l.querySelector('.ink');
    ink.style.width = (p * 100).toFixed(1) + '%';
    ink.style.setProperty('--e', p > .01 && p < .99 ? 1 : 0);
  });
  const max = document.documentElement.scrollHeight - innerHeight;
  const total = max > 0 ? Math.max(0, Math.min(1, scrollY / max)) : 0;
  pct.textContent = Math.round(total * 100) + '%';
}
addEventListener('scroll', measure, { passive:true });
addEventListener('resize', measure);
document.fonts.ready.then(measure);
measure();

/* amber cursor: dot + trailing ring (fine pointers only) */
(function(){
  if (!matchMedia('(pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring);
  let mx=-99,my=-99,rx=mx,ry=my;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
})();
</script>
</body>
</html>
