<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>The whole secret · Salt Effect 18/76</title>
<!-- CURTAINS line reveal suite: mask-rise, blur-in, wipe and word stagger, one per line, played in turn. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { color:var(--bone); font-family:'Instrument Sans',system-ui,sans-serif; font-size:17px; line-height:1.55;
    background:
      radial-gradient(40% 50% at 88% 0%, rgba(233,161,59,.16), transparent 70%),
      radial-gradient(90% 80% at 20% 100%, var(--ink-0), transparent 70%),
      var(--ink-1); }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  .mono b { color:var(--amber); font-weight:400; }

  /* a hanging lamp, top right: where the light in this scene comes from */
  .lamp { position:fixed; top:0; right:12vw; width:2px; height:18vh; background:linear-gradient(var(--ink-2), var(--plum)); }
  .lamp::after { content:''; position:absolute; left:50%; bottom:-10px; width:18px; height:18px; border-radius:50%; transform:translateX(-50%);
    background:var(--amber-hi); box-shadow:0 0 18px 6px rgba(240,176,85,.55), 0 0 90px 40px rgba(233,161,59,.16); }

  .tag { position:fixed; top:88px; left:clamp(20px,8vw,120px); }
  .stage { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; padding:96px clamp(20px,8vw,120px) 80px; }
  .item { display:grid; grid-template-columns:clamp(34px,4vw,60px) 1fr; align-items:baseline; }
  .item .n { font-size:11px; color:var(--plum); transition:color .6s; }
  .item.in .n { color:var(--amber); }
  h2 { font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:clamp(46px,7.6vw,122px); line-height:1.02; letter-spacing:-.02em; }
  h2 em { font-style:italic; font-weight:500; color:var(--amber); }
  .i2 h2 { color:var(--lilac); }
  .i3 h2 { padding-bottom:.08em; }

  /* ---------- style 1: mask rise ---------- */
  .rise .lm { display:block; overflow:hidden; padding-bottom:.06em; }
  .rise .lm span { display:block; transform:translateY(110%); transition:transform 1.1s cubic-bezier(.19,1,.22,1); }
  .rise.in .lm span { transform:none; }

  /* ---------- style 2: blur in ---------- */
  .blurin .lm { display:block; opacity:0; filter:blur(14px); transform:translateY(18px); transition:opacity 1.2s cubic-bezier(.19,1,.22,1), filter 1.2s cubic-bezier(.19,1,.22,1), transform 1.2s cubic-bezier(.19,1,.22,1); }
  .blurin.in .lm { opacity:1; filter:blur(0); transform:none; }

  /* ---------- style 3: wipe ---------- */
  .wipe .lm { display:block; position:relative; }
  .wipe .lm span { display:block; clip-path:inset(-10% 100% -20% 0); transition:clip-path 1.2s cubic-bezier(.76,0,.24,1); }
  .wipe.in .lm span { clip-path:inset(-10% -2% -20% 0); }
  .wipe .lm::after { content:''; position:absolute; left:0; bottom:.02em; height:3px; width:100%; background:var(--amber); transform:scaleX(0); transform-origin:0 50%;
    transition:transform 1.2s cubic-bezier(.76,0,.24,1) .15s, opacity .8s ease 1.6s; opacity:.9; }
  .wipe.in .lm::after { transform:scaleX(1); opacity:0; }

  /* ---------- style 4: word stagger ---------- */
  .after { margin-top:clamp(26px,4.5vh,48px); max-width:34em; font-size:clamp(17px,1.5vw,21px); color:var(--mist); }
  .stagger .w { display:inline-block; opacity:0; transform:translateY(22px) rotate(2.5deg); transition:opacity .8s cubic-bezier(.19,1,.22,1), transform .8s cubic-bezier(.19,1,.22,1); }
  .stagger.in .w { opacity:1; transform:none; }

  #replay { position:fixed; bottom:26px; right:clamp(20px,4vw,48px); z-index:30; font:500 15px/1 'Instrument Sans',system-ui,sans-serif; color:var(--lilac);
    background:rgba(14,8,31,.6); border:1px solid rgba(179,170,205,.3); padding:13px 20px; border-radius:999px; cursor:pointer; transition:color .3s, border-color .3s; }
  #replay:hover { color:var(--amber-hi); border-color:var(--amber); }
  .foot { position:fixed; bottom:34px; left:clamp(20px,8vw,120px); }
  @media (max-width:700px){
    .item { grid-template-columns:1fr; }
    .item .n { margin:18px 0 2px; }
    .item:first-child .n { margin-top:0; }
    .foot { display:none; }
    .lamp { right:18vw; height:12vh; }
    .stage { justify-content:center; padding-top:110px; }
  }
</style>
</head>
<body>
  <div class="lamp" aria-hidden="true"></div>
  <span class="mono tag"><b>II · The door</b> — 18/76</span>

  <div class="stage">
    <div class="item i1 reveal rise"><span class="mono n">01</span>
      <h2><span class="lm"><span>Keep your word.</span></span></h2></div>
    <div class="item i2 reveal blurin"><span class="mono n">02</span>
      <h2><span class="lm">Then keep it again.</span></h2></div>
    <div class="item i3 reveal wipe"><span class="mono n">03</span>
      <h2><span class="lm"><span>That’s the whole <em>secret.</em></span></span></h2></div>
    <div class="item reveal stagger"><span></span>
      <p class="after">Every promise kept is one more reason to come back, and one more name passed along.</p></div>
  </div>

  <span class="mono foot">Kodak, TN · 35.97° N, 83.62° W</span>
  <button id="replay" type="button">↻ Again</button>

<script>
/* word-split for the stagger line */
const st = document.querySelector('.stagger .after');
st.innerHTML = st.textContent.trim().split(' ').map(w => `<span class="w">${w}</span>`).join(' ');
document.querySelectorAll('.stagger .w').forEach((w, i) => w.style.transitionDelay = (i * 55) + 'ms');

/* play the four entrances in turn */
const items = [...document.querySelectorAll('.reveal')];
const AT = [150, 850, 1650, 2550];
let timers = [];
function play(){
  timers.forEach(clearTimeout); timers = [];
  items.forEach(s => s.classList.remove('in'));
  void document.body.offsetWidth;
  items.forEach((s, i) => timers.push(setTimeout(() => s.classList.add('in'), AT[i])));
}
SCENE.onFirstEnter(play);
addEventListener('scene:enter', play);
document.getElementById('replay').addEventListener('click', () => {
  items.forEach(s => s.classList.remove('in'));
  setTimeout(play, 420);
});
</script>
<!-- SIGNATURE CURSOR (lamp amber) -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(233,161,59,.85); transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease; }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  dot.style.opacity=ring.style.opacity='0';   /* hidden until the first pointer move, so nothing parks over the copy */
  document.body.append(dot,ring);
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{if(ring.style.opacity){rx=e.clientX;ry=e.clientY;dot.style.opacity=ring.style.opacity='';}mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
  document.body.addEventListener('mouseover',e=>{
    const hit = e.target.closest('a,button');
    ring.style.width = hit ? '60px' : '36px'; ring.style.height = hit ? '60px' : '36px';
  });
})();
</script>
</body>
</html>
