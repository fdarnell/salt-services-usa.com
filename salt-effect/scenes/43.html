<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<script src="_bridge.js"></script>
<title>A pinch, from many hands · Salt Services</title>
<!-- ASSEMBLY · particle logo. Thousands of grains fly in from the edges and assemble into the Salt hand,
     its falling salt in amber. The cursor pushes them around; click and they burst and come back. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--ink-0); color:var(--bone); font-family:'Instrument Sans',system-ui,sans-serif; }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  .hud { position:fixed; z-index:10; }
  .b1 { bottom:30px; left:36px; } .b2 { bottom:30px; right:36px; text-align:right; }
  .line { position:fixed; left:50%; transform:translateX(-50%); z-index:10; text-align:center; width:min(92vw,900px); pointer-events:none; }
  .line h1 { font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:clamp(36px,4.2vw,62px); line-height:.98; letter-spacing:-.02em; }
  .line h1 em { font-style:italic; font-weight:500; color:var(--amber); }
  .line h1 { opacity:0; transform:translateY(14px); transition:opacity 1.2s ease 1.4s, transform 1.2s cubic-bezier(.2,.7,.2,1) 1.4s; }
  .go .line h1 { opacity:1; transform:none; }
  @media (max-width:700px){
    .line h1 { font-size:38px; }
    .line h1 em { display:block; }
    .b1 { left:20px; bottom:24px; } .b2 { left:20px; right:auto; text-align:left; bottom:46px; }
  }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="line" id="line"><h1>A pinch, from <em>many hands.</em></h1></div>
  <span class="mono hud b1">VI · The world — 65/76</span>
  <span class="mono hud b2" id="count">Click · they scatter and come back</span>

<script>
const LOGO_URL = '../assets/logo/salt-logo.png';
const DPR = Math.min(devicePixelRatio || 1, 2);
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const lineEl = document.getElementById('line');
let W, H, GAP, parts = [], ground, assembled = false, logoBox = { x:0, y:0, s:0 };

const logo = new Image();
logo.src = LOGO_URL;

function build(){
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ground = ctx.createRadialGradient(W/2, H*.42, 0, W/2, H*.42, Math.max(W, H) * .65);
  ground.addColorStop(0, '#2b1d52'); ground.addColorStop(.5, '#180f2f'); ground.addColorStop(1, '#0e081f');
  ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H);
  if (!logo.complete || !logo.naturalWidth) return;

  /* size and place the hand: centred, above the line of type */
  const narrow = W / H < .8;
  const S = Math.round(Math.min(W * (narrow ? .86 : .5), H * (narrow ? .46 : .6)));
  const lx = Math.round((W - S) / 2), ly = Math.round(Math.max(76, (H - S - (narrow ? 150 : 110)) / 2));
  logoBox = { x:lx, y:ly, s:S };
  lineEl.style.top = (ly + S + (narrow ? 18 : 10)) + 'px';
  GAP = S > 420 ? 3 : 2;

  /* draw the logo and read its alpha */
  const off = document.createElement('canvas'); off.width = off.height = S;
  const o = off.getContext('2d');
  o.drawImage(logo, 0, 0, S, S);
  const px = o.getImageData(0, 0, S, S).data;

  /* find the falling grains: small separate shapes (the hand is one big shape) */
  const lab = new Int32Array(S * S).fill(-1), sizes = [], stack = [];
  for (let i = 0; i < S * S; i++) {
    if (lab[i] !== -1 || px[i*4+3] < 100) continue;
    const id = sizes.length; let n = 0; stack.push(i); lab[i] = id;
    while (stack.length) {
      const j = stack.pop(); n++;
      const x = j % S, y = (j / S) | 0;
      for (const k of [x > 0 ? j-1 : -1, x < S-1 ? j+1 : -1, y > 0 ? j-S : -1, y < S-1 ? j+S : -1])
        if (k >= 0 && lab[k] === -1 && px[k*4+3] >= 100) { lab[k] = id; stack.push(k); }
    }
    sizes.push(n);
  }
  const grainMax = S * S * .004;

  parts = [];
  let grains = 0;
  for (let y = 0; y < S; y += GAP) for (let x = 0; x < S; x += GAP) {
    const i = y * S + x;
    if (px[i*4+3] < 100) continue;
    const isGrain = sizes[lab[i]] < grainMax;
    if (isGrain) grains++;
    const edge = Math.floor(Math.random() * 4);
    parts.push({
      hx: lx + x, hy: ly + y,
      x: edge === 0 ? -20 : edge === 1 ? W + 20 : Math.random() * W,
      y: edge < 2 ? Math.random() * H : (edge === 2 ? -20 : H + 20),
      vx: 0, vy: 0,
      amber: isGrain,
      size: isGrain ? Math.random() * 1.2 + 1.3 : Math.random() * 1.2 + .9
    });
  }
  document.getElementById('count').textContent = `${parts.length.toLocaleString('en-US')} grains · ${SCENE.reduce ? 'one hand' : (matchMedia('(hover:none)').matches ? 'tap' : 'click') + ' to scatter'}`;
  if (assembled) parts.forEach(p => { p.x = p.hx; p.y = p.hy; p.vx = p.vy = 0; });
  if (SCENE.reduce && SCENE.thaw) SCENE.thaw(400, false);   /* draw the finished hand */
}
logo.onload = build;
addEventListener('resize', build);
build();

/* they wait off-screen until the visitor arrives, then fly in */
let gather = false;
/* reduced motion: no fly-in and no bursts, the hand is simply there, finished */
if (SCENE.reduce) { gather = assembled = true; document.body.classList.add('go'); parts.forEach(p => { p.x = p.hx; p.y = p.hy; }); }
else SCENE.onFirstEnter(() => { gather = true; document.body.classList.add('go'); setTimeout(() => assembled = true, 2500); });
function burst(){
  if (SCENE.reduce) return;
  parts.forEach(p => { const a = Math.random() * Math.PI * 2, f = Math.random() * 26 + 8; p.vx += Math.cos(a) * f; p.vy += Math.sin(a) * f; });
}
addEventListener('click', burst);
let running = true;
addEventListener('scene:leave', () => running = false);
addEventListener('scene:enter', () => { running = true; if (gather) burst(); });
addEventListener('scene:progress', () => running = true);

/* interaction: the cursor pushes grains aside */
let mx = -9999, my = -9999, lastMove = -1e9;
addEventListener('pointermove', e => { if (SCENE.reduce) return; mx = e.clientX; my = e.clientY; lastMove = performance.now(); });
const t0 = performance.now();

(function loop(){
  requestAnimationFrame(loop);
  if (!running || !W) return;
  const now = performance.now();
  /* idle: a phantom hand brushes through the logo now and then */
  if (now - lastMove > 3000){
    if (assembled && !SCENE.reduce) {
      const t = now / 1300, c = Math.sin(now / 5200);
      const r = logoBox.s;
      mx = logoBox.x + r/2 + Math.cos(t) * r * .55;
      my = logoBox.y + r/2 + Math.sin(t * 2.2) * r * .2 + (c < 0 ? 9999 : 0);   /* rests half the time */
    } else { mx = my = -9999; }
  }
  ctx.globalAlpha = .38; ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;   /* motion trails */
  for (const p of parts){
    if (gather) {
      p.vx += (p.hx - p.x) * .012;
      p.vy += (p.hy - p.y) * .012;
    } else {
      /* waiting just outside the frame, drifting */
      p.vx += (Math.random() - .5) * .3; p.vy += (Math.random() - .5) * .3;
    }
    const dx = p.x - mx, dy = p.y - my;
    const d2 = dx*dx + dy*dy;
    if (d2 < 5200){
      const d = Math.sqrt(d2) || 1, f = (72 - d) * .09;
      if (f > 0){ p.vx += dx / d * f; p.vy += dy / d * f; }
    }
    p.vx *= .90; p.vy *= .90;
    p.x += p.vx; p.y += p.vy;
    ctx.fillStyle = p.amber ? '#f0b055' : '#f5f3ed';
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
})();
</script>
<!-- signature cursor, amber (fine pointers only) -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; opacity:0; transition:opacity .3s; }
  .cur-on #wlDot,.cur-on #wlRing{ opacity:1; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(233,161,59,.9); transform:translate(-50%,-50%); }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring);
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{document.body.classList.add('cur-on');mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
})();
</script>
</body>
</html>
