<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<script src="_bridge.js"></script>
<title>From one town to the next · Salt Services</title>
<!-- DEPTH · infinite 3D image tunnel. The story scroll flies you through a gallery floating in depth;
     images recycle behind you so it never ends. Alone, the wheel and a drag fly it too. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:radial-gradient(ellipse at 50% 50%, var(--ink-1) 0%, var(--ink-0) 70%); color:var(--bone); font-family:'Instrument Sans',system-ui,sans-serif; }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  #gl { position:fixed; inset:0; }
  .shade { position:fixed; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(ellipse 46% 36% at 50% 50%, rgba(14,8,31,.62) 0%, rgba(14,8,31,.25) 60%, transparent 100%); }
  .hud { position:fixed; z-index:10; text-shadow:0 1px 10px rgba(14,8,31,.9); }
  .b1 { bottom:30px; left:36px; } .b2 { bottom:30px; right:36px; text-align:right; }
  .b2 b { color:var(--amber); font-weight:400; }
  .title { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:8; text-align:center; pointer-events:none; width:min(92vw,900px); }
  .title h1 { font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:clamp(42px,6.4vw,96px); line-height:.95; letter-spacing:-.02em;
    text-shadow:0 2px 30px rgba(14,8,31,.85), 0 0 4px rgba(14,8,31,.5); }
  .title h1 em { font-style:italic; font-weight:500; color:var(--amber-hi); }
  .title .mono { display:block; margin-top:22px; color:var(--lilac); }
  @media (max-width:700px){
    .b1 { left:20px; bottom:24px; } .b2 { right:20px; bottom:46px; }
    .b1 { bottom:22px; }
    .b2 { left:20px; right:auto; text-align:left; }
    .title h1 { font-size:46px; }
  }
</style>
</head>
<body>
  <div id="gl"></div>
  <div class="shade"></div>
  <div class="title">
    <h1>From one town<br>to <em>the next.</em></h1>
    <span class="mono" id="hint">Keep scrolling to travel</span>
  </div>
  <span class="mono hud b1">VI · The world — 59/76</span>
  <span class="mono hud b2">Next town · <b id="town">Sevierville</b></span>

<script type="importmap">
{ "imports": { "three": "../kit/three/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const IMAGES = ['shop-dusk','main-street-lit','town-ridge','workshop','bridge-river','counter',
  'night-road','market-lights','window-rain','salt-crystal','map-glow','globe-lights'].map(n => `../assets/img/${n}.jpg`);
/* real East Tennessee towns, in the order you'd pass them heading out from Kodak */
const TOWNS = ['Sevierville','Pigeon Forge','Gatlinburg','Seymour','Maryville','Knoxville','Strawberry Plains','Dandridge','Jefferson City','Morristown','Newport','Cosby'];

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('gl').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0e081f, 6, 26);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 60);

/* image planes staggered along -Z, alternating sides */
const loader = new THREE.TextureLoader();
const STEP = 3.2, planes = [];
const isNarrow = () => innerWidth / innerHeight < .8;
const spread = () => isNarrow() ? .72 : 1;
IMAGES.forEach((src, i) => {
  const mat = new THREE.MeshBasicMaterial({ color:0x2b1d52, transparent:true });
  loader.load(src, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; mat.map = t; mat.color.set(0xffffff); mat.needsUpdate = true; });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.2), mat);
  const side = i % 2 ? 1 : -1;
  m.userData.side = side;
  m.userData.baseX = side * (1.7 + Math.random()*.8);
  m.userData.baseY = (Math.random()-.5)*2.2;
  m.position.set(m.userData.baseX, m.userData.baseY, -i * STEP - 4.5);
  m.rotation.y = side * -.28;
  scene.add(m); planes.push(m);
});
const TOTAL = IMAGES.length * STEP;

/* salt specks hanging in the tunnel, white with a few amber */
const S = 500, sp = new Float32Array(S*3), sc = new Float32Array(S*3);
const cW = new THREE.Color(0xf5f3ed), cA = new THREE.Color(0xf0b055);
for (let i = 0; i < S; i++) {
  sp.set([(Math.random()-.5)*12, (Math.random()-.5)*8, -Math.random()*TOTAL], i*3);
  const c = Math.random() < .18 ? cA : cW; sc.set([c.r, c.g, c.b], i*3);
}
const specGeo = new THREE.BufferGeometry();
specGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
specGeo.setAttribute('color', new THREE.BufferAttribute(sc, 3));
const dotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d');
  const g = x.createRadialGradient(16,16,0,16,16,16); g.addColorStop(0,'#fff'); g.addColorStop(.45,'rgba(255,255,255,.8)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,32,32); return new THREE.CanvasTexture(c); })();
scene.add(new THREE.Points(specGeo, new THREE.PointsMaterial({ size:.06, map:dotTex, vertexColors:true, transparent:true, opacity:.8, depthWrite:false })));

/* travel: the story scroll drives the flight; a slow drift keeps it alive.
   Opened alone, the wheel and a drag fly it as before. */
const FLIGHT = TOTAL * 1.25;           /* distance covered while the scene crosses the screen */
let z = 0, vz = 0, scrollZ = 0, scrollTarget = 0, dragging = false, lastY = 0;
addEventListener('scene:progress', e => { scrollTarget = e.detail.p * FLIGHT; running = true; });
if (!SCENE.embedded) addEventListener('wheel', e => vz += e.deltaY * .0035, { passive:true });
addEventListener('pointerdown', e => { if (e.pointerType !== 'touch' || !SCENE.embedded) { dragging = true; lastY = e.clientY; } });
addEventListener('pointermove', e => { if (dragging) { vz -= (e.clientY - lastY) * .012; lastY = e.clientY; } });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointercancel', () => dragging = false);
const mouse = { x:0, y:0 };
addEventListener('pointermove', e => { if (e.pointerType !== 'touch') { mouse.x = e.clientX/innerWidth - .5; mouse.y = e.clientY/innerHeight - .5; } });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let hidden = false, running = true;
addEventListener('scene:leave', () => running = false);
addEventListener('scene:enter', () => running = true);
document.addEventListener('visibilitychange', () => hidden = document.hidden);
const townEl = document.getElementById('town');
let lastTown = -1;
const clock = new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  if (hidden || !running) return;
  const t = clock.getElapsedTime();
  vz += .0016; vz *= .94;               /* idle drift */
  z += vz;
  scrollZ += (scrollTarget - scrollZ) * .06;
  const zz = z + scrollZ;
  camera.position.set(mouse.x * .7, -mouse.y * .5, -zz);
  camera.lookAt(mouse.x * .4, -mouse.y * .3, -zz - 5);

  /* recycle planes for infinity, both directions */
  const k = spread();
  planes.forEach(p => {
    while (p.position.z > -zz + 4)      p.position.z -= TOTAL;
    while (p.position.z < -zz - TOTAL)  p.position.z += TOTAL;
    p.scale.setScalar(k < 1 ? .62 : 1);
    p.position.x = p.userData.baseX * k + Math.sin(t * .5 + p.position.z) * .1;
    p.position.y = p.userData.baseY + Math.cos(t * .4 + p.position.z) * .08;
  });
  for (let i = 2; i < S*3; i += 3) {
    while (sp[i] > -zz - 1.2) sp[i] -= TOTAL;          /* recycle before a speck gets close enough to look like a snowball */
    while (sp[i] < -zz - TOTAL - 1.2) sp[i] += TOTAL;
  }
  specGeo.attributes.position.needsUpdate = true;
  const town = ((Math.floor(zz / (STEP * 2)) % TOWNS.length) + TOWNS.length) % TOWNS.length;
  if (town !== lastTown) { townEl.textContent = TOWNS[town]; lastTown = town; }
  renderer.render(scene, camera);
})();
</script>
<!-- signature cursor, amber (fine pointers only) -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; opacity:0; transition:opacity .3s; }
  .cur-on #wlDot,.cur-on #wlRing{ opacity:1; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(233,161,59,.9); transform:translate(-50%,-50%); }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!SCENE.embedded) document.getElementById('hint').textContent = 'Scroll or drag to travel';
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring);
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{document.body.classList.add('cur-on');mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
})();
</script>
</body>
</html>
