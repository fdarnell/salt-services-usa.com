<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>Five services</title>
<!-- 53/76 · ATELIER split menu overlay: the burger opens a two-panel fullscreen menu, big serif
     links stagger in, and hovering a service shows its picture on the right panel.
     The menu opens itself shortly after the visitor arrives, and pictures cycle until hovered. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{--ink-0:#0e081f;--ink-1:#180f2f;--ink-2:#2b1d52;--amber:#e9a13b;--amber-hi:#f0b055;--bone:#f5f3ed;--bone-2:#ece9e0;--lilac:#eae7f4;--mist:#b3aacd;--plum:#635a7d;--ink-text:#201439}
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:radial-gradient(ellipse 60% 55% at 50% 52%, var(--ink-2), var(--ink-1) 60%, var(--ink-0)); color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif; }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }

  /* base page (closed state) */
  .base { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 16px; }
  .base h1 { font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(44px,7vw,108px); line-height:.98; letter-spacing:-.02em; color:var(--bone); }
  .base h1 em { font-style:italic; font-weight:500; color:var(--amber-hi); }
  .base .open-btn { margin-top:34px; font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--bone); background:none; border:1px solid rgba(233,161,59,.55); border-radius:999px; padding:14px 26px; cursor:pointer; transition:background .3s, border-color .3s; }
  .base .open-btn:hover { background:rgba(233,161,59,.12); border-color:var(--amber); }
  .t1 { position:fixed; top:88px; left:32px; z-index:40; }

  /* burger: sits below the story page's own 64px header */
  #burger { position:fixed; top:76px; right:24px; z-index:60; width:52px; height:52px; border:none; background:none; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:7px; mix-blend-mode:difference; }
  #burger span { width:26px; height:2px; background:var(--bone); border-radius:2px; transition:all .45s cubic-bezier(.76,0,.24,1); }
  body.open #burger span:nth-child(1){ transform:translateY(4.5px) rotate(45deg); }
  body.open #burger span:nth-child(2){ transform:translateY(-4.5px) rotate(-45deg); }

  /* two panels */
  .panel { position:fixed; top:0; height:100%; z-index:50; transition:transform .8s cubic-bezier(.76,0,.24,1); }
  .p-left  { left:0; width:58%; background:var(--bone); transform:translateX(-101%); }
  .p-right { right:0; width:42%; background:var(--ink-0); transform:translateX(101%); transition-delay:.06s; }
  body.open .panel { transform:translateX(0); }

  /* links */
  .links { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:72px 6vw 0; }
  .links .head { margin-bottom:18px; color:var(--plum); opacity:0; transition:opacity .5s .3s; }
  body.open .links .head { opacity:1; }
  .links a { position:relative; color:var(--ink-text); text-decoration:none; font-family:'Fraunces',Georgia,serif; font-weight:500; letter-spacing:-.02em;
    font-size:clamp(30px,3.7vw,64px); line-height:1.18; white-space:nowrap; display:flex; align-items:baseline; gap:18px; width:max-content; max-width:100%;
    opacity:0; transform:translateY(40px); transition:opacity .5s, transform .7s cubic-bezier(.19,1,.22,1), color .3s; }
  body.open .links a { opacity:1; transform:none; }
  .links a:nth-child(2){ transition-delay:.34s } .links a:nth-child(3){ transition-delay:.42s }
  .links a:nth-child(4){ transition-delay:.5s } .links a:nth-child(5){ transition-delay:.58s } .links a:nth-child(6){ transition-delay:.66s }
  .links a .idx { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; color:var(--plum); flex:none; }
  .links a em { font-style:italic; color:var(--amber); opacity:0; margin-left:4px; transition:opacity .3s; }
  .links a:not(.hot) { color:var(--plum); }
  body.open .links a.hot { transform:translateX(14px); }
  .links a.hot em, .links a:hover em { opacity:1; }
  .links a:focus-visible { outline:2px solid var(--amber); outline-offset:6px; }

  /* right panel: picture preview */
  .p-right .frame { position:absolute; inset:16% 10% 14%; overflow:hidden; border-radius:4px; }
  .p-right img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(1.12);
    transition:opacity .5s, transform 1.2s cubic-bezier(.19,1,.22,1); }
  .p-right img.on { opacity:1; transform:scale(1); }
  .p-right .cap { position:absolute; left:10%; right:10%; bottom:6%; display:flex; justify-content:space-between; gap:12px; }
  .p-right .cap b { font-weight:400; color:var(--amber-hi); }
  @media (max-width:760px){
    .t1 { left:16px; }
    #burger { right:8px; }
    .p-left { width:100%; top:auto; bottom:0; height:64%; }
    .p-right { width:100%; height:36%; }
    .p-right .frame { inset:76px 16px 14px; }
    .p-right .cap { display:none; }
    .links { padding:0 16px; }
    .links a { gap:12px; font-size:min(30px, 6.9vw); min-height:44px; padding:6px 0; }   /* 44px tap targets on phones */
  }
  @media (hover:none){ .hint-fine{ display:none; } }
</style>
</head>
<body>
  <button id="burger" aria-label="Open the services menu" aria-expanded="false"><span></span><span></span></button>
  <span class="mono t1">V · The signal — 53/76</span>

  <div class="base">
    <h1>Five services.<br>One <em>pipeline.</em></h1>
    <button class="open-btn" id="openBtn">See the five</button>
  </div>

  <div class="panel p-left">
    <nav class="links" id="links" aria-label="Salt Services">
      <span class="mono head">What Salt Services does</span>
      <a href="https://saltservicesusa.com/services/" target="_top" data-img="0"><span class="idx">01</span>Web design<em>→</em></a>
      <a href="https://saltservicesusa.com/services/" target="_top" data-img="1"><span class="idx">02</span>SEO &amp; AEO<em>→</em></a>
      <a href="https://saltservicesusa.com/services/" target="_top" data-img="2"><span class="idx">03</span>Digital advertising<em>→</em></a>
      <a href="https://saltservicesusa.com/services/" target="_top" data-img="3"><span class="idx">04</span>CRM implementation<em>→</em></a>
      <a href="https://saltservicesusa.com/services/" target="_top" data-img="4"><span class="idx">05</span>AI implementation<em>→</em></a>
    </nav>
  </div>
  <div class="panel p-right" aria-hidden="true">
    <div class="frame">
      <img src="../assets/img/shop-dusk-tall.jpg" alt="">
      <img src="../assets/img/map-glow-tall.jpg" alt="">
      <img src="../assets/img/market-lights-tall.jpg" alt="">
      <img src="../assets/img/bridge-river-tall.jpg" alt="">
      <img src="../assets/img/window-rain-tall.jpg" alt="">
    </div>
    <div class="cap mono"><span><b id="capIdx">01</b> / 05</span><span class="hint-fine">Hover a service</span></div>
  </div>

<script>
const body = document.body, burger = document.getElementById('burger');
const links = [...document.querySelectorAll('#links a')];
const imgs = document.querySelectorAll('.p-right img');
const capIdx = document.getElementById('capIdx');
let cur = 0, hovering = false, cycle = null, autoOpen = null;

function setOpen(v){
  body.classList.toggle('open', v);
  burger.setAttribute('aria-expanded', v);
  burger.setAttribute('aria-label', v ? 'Close the services menu' : 'Open the services menu');
  clearInterval(cycle);
  if (v){ pick(0); cycle = setInterval(() => { if (!hovering) pick((cur + 1) % links.length); }, 2400); }
}
function pick(i){
  cur = i;
  imgs.forEach((im, k) => im.classList.toggle('on', k === i));
  links.forEach((a, k) => a.classList.toggle('hot', k === i));
  capIdx.textContent = '0' + (i + 1);
}
burger.addEventListener('click', () => { clearTimeout(autoOpen); setOpen(!body.classList.contains('open')); });
document.getElementById('openBtn').addEventListener('click', () => { clearTimeout(autoOpen); setOpen(true); });
addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });

const nav = document.getElementById('links');
nav.addEventListener('mouseover', e => { const a = e.target.closest('a'); if (!a) return; hovering = true; pick(+a.dataset.img); });
nav.addEventListener('mouseleave', () => { hovering = false; });
nav.addEventListener('focusin', e => { const a = e.target.closest('a'); if (a) pick(+a.dataset.img); });

/* the menu opens itself a moment after the visitor arrives, so the move is never missed */
function arrive(){ clearTimeout(autoOpen); autoOpen = setTimeout(() => setOpen(true), 1500); }
SCENE.onFirstEnter(arrive);
addEventListener('scene:enter', arrive);
addEventListener('scene:leave', () => { clearTimeout(autoOpen); setOpen(false); });
</script>
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; mix-blend-mode:difference; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(255,255,255,.85); transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease; }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid #fff; mix-blend-mode:difference; transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  dot.style.opacity=ring.style.opacity='0';   /* hidden until the first pointer move, so nothing parks over the copy */
  document.body.append(dot,ring);
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{if(ring.style.opacity){rx=e.clientX;ry=e.clientY;dot.style.opacity=ring.style.opacity='';}mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
  document.body.addEventListener('mouseover',e=>{
    const hit = e.target.closest('a,button');
    ring.style.width = hit ? '60px' : '36px'; ring.style.height = hit ? '60px' : '36px';
  });
})();
</script>
</body>
</html>
