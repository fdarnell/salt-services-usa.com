<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>Open · Salt Effect 14/56</title>
<!-- LOUD text mask: a giant word is a window. The shop at dusk and the lit street pan slowly inside the letters,
     with living lamp-light drifting over them. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--ink-0); font-family:'Instrument Sans',system-ui,sans-serif; font-size:17px; line-height:1.55; color:var(--lilac); }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }
  .mono b { color:var(--amber); font-weight:400; }

  #media { position:fixed; inset:0; }
  #inkCanvas { position:absolute; inset:0; width:100%; height:100%; }

  /* the cover with a word-shaped hole */
  #cover { position:fixed; inset:0; z-index:5; }
  #cover svg { width:100%; height:100%; display:block; }
  .word { font-family:'Fraunces',Georgia,serif; font-weight:720; letter-spacing:-.01em; }
  #rim { fill:none; stroke:var(--amber-hi); stroke-opacity:.5; stroke-width:1.4; }

  .line { position:fixed; z-index:10; left:0; right:0; text-align:center; padding:0 20px;
    font-family:'Fraunces',Georgia,serif; font-weight:500; font-size:clamp(22px,2.6vw,36px); letter-spacing:-.01em; line-height:1.2; color:var(--bone); }
  .line em { font-style:italic; color:var(--amber); }
  .hud { position:fixed; z-index:10; }
  .t1{ top:88px; left:clamp(20px,4vw,48px); } .t2{ top:88px; right:clamp(20px,4vw,48px); text-align:right; }
  .b1{ bottom:26px; left:clamp(20px,4vw,48px); } .b2{ bottom:26px; right:clamp(20px,4vw,48px); text-align:right; }
  @media (max-width:700px){ .t2, .b2 { display:none; } }
</style>
</head>
<body>
  <div id="media"><canvas id="inkCanvas"></canvas></div>

  <div id="cover">
    <svg id="maskSvg" aria-hidden="true">
      <defs>
        <mask id="holeMask">
          <rect width="100%" height="100%" fill="white"/>
          <text id="maskText" class="word" text-anchor="middle" fill="black"></text>
        </mask>
      </defs>
      <rect width="100%" height="100%" fill="#0e081f" mask="url(#holeMask)"/>
      <text id="rim" class="word" text-anchor="middle"></text>
    </svg>
  </div>
  <h2 class="line" id="line"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Open. </span>Six days a week. <em>Seven when it matters.</em></h2>

  <span class="mono hud t1"><b>II · The door</b> — 14/56</span>
  <span class="mono hud t2">Sign on · 7:00 AM</span>
  <span class="mono hud b1">Kodak, TN · 35.97° N, 83.62° W</span>
  <span class="mono hud b2">The word is a window</span>

<script>
/* ================= SLOTS ================= */
const MASK_WORD = 'OPEN';
const narrow = () => innerWidth < 700;
const IMAGES = () => narrow() ? ['../assets/img/shop-dusk-tall.jpg', '../assets/img/main-street-lit-tall.jpg']
                              : ['../assets/img/shop-dusk.jpg', '../assets/img/main-street-lit.jpg'];

/* ---------- fit the word to the viewport (two lines on a phone: OP / EN) ---------- */
const svg = document.getElementById('maskSvg');
const txts = [document.getElementById('maskText'), document.getElementById('rim')];
const line = document.getElementById('line');
let box = { cx:0, cy:0, h:0 };
function setLines(lines, size, cx, cy){
  const lh = size * .86, top = cy - lh * (lines.length - 1) / 2;
  txts.forEach(t => {
    t.setAttribute('font-size', size);
    t.innerHTML = lines.map((l, i) => `<tspan x="${cx}" y="${top + i * lh}" dominant-baseline="central">${l}</tspan>`).join('');
  });
}
function fitText(){
  const W = innerWidth, H = innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const lines = narrow() ? [MASK_WORD.slice(0, 2), MASK_WORD.slice(2)] : [MASK_WORD];
  const cx = W / 2, cy = H * (narrow() ? .46 : .47);
  let lo = 10, hi = 1400;
  for (let i = 0; i < 22; i++){
    const mid = (lo + hi) / 2;
    setLines(lines, mid, cx, cy);
    const b = txts[0].getBBox();
    (b.width > W * (narrow() ? .9 : .88) || b.height > H * (narrow() ? .62 : .66)) ? hi = mid : lo = mid;
  }
  setLines(lines, lo, cx, cy);
  const b = txts[0].getBBox();
  line.style.top = Math.min(H - 110, b.y + b.height - lo * (narrow() ? .02 : .1)) + 'px';
}
fitText(); addEventListener('resize', fitText);
if (document.fonts) document.fonts.ready.then(fitText);

/* ---------- mouse parallax on the hole ---------- */
let px = 0, py = 0, tx = 0, ty = 0;
addEventListener('mousemove', e => {
  tx = (e.clientX / innerWidth - .5) * 26;
  ty = (e.clientY / innerHeight - .5) * 16;
});
addEventListener('scene:progress', e => { if (!matchMedia('(hover:hover)').matches) ty = (e.detail.p - .5) * -40; });
(function par(){
  px += (tx - px) * .06; py += (ty - py) * .06;
  txts.forEach(t => t.setAttribute('transform', `translate(${px} ${py})`));
  requestAnimationFrame(par);
})();

/* ---------- inside the letters: the two story pictures, panning slowly, cross-fading ---------- */
const cv = document.getElementById('inkCanvas'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio || 1, 2);
function fit(){ W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize', () => { fit(); load(); });

let pics = [], picKey = '';
function load(){
  const list = IMAGES();
  if (list.join() === picKey) return;
  picKey = list.join();
  pics = list.map(src => { const im = new Image(); im.decoding = 'async'; im.src = src; return im; });
}
load();
const ready = im => im.complete && im.naturalWidth > 0;

function drawPic(im, alpha, t, dir){
  const s = Math.max(W / im.naturalWidth, H / im.naturalHeight) * 1.16;  /* cover, with room to pan */
  const w = im.naturalWidth * s, h = im.naturalHeight * s;
  const ox = (W - w) / 2 + Math.sin(t * .06 * dir) * (w - W) / 2;
  const oy = (H - h) / 2 + Math.cos(t * .045) * (h - H) / 2 * .6;
  ctx.globalAlpha = alpha;
  ctx.drawImage(im, ox, oy, w, h);
  ctx.globalAlpha = 1;
}

/* lamp-light blots: amber and plum, drifting (they carry the scene on their own until the pictures load) */
const BLOTS = Array.from({ length: 7 }, (_, i) => ({
  c: ['233,161,59', '240,176,85', '99,90,125', '233,161,59', '43,29,82', '179,170,205', '240,176,85'][i],
  r: .2 + Math.random() * .28, sx: .6 + Math.random() * .9, sy: .5 + Math.random() * .9, ph: Math.random() * Math.PI * 2
}));
const t0 = performance.now();
(function frame(){
  const t = (performance.now() - t0) / 1000;
  const anyPic = pics.some(ready);
  ctx.fillStyle = '#180f2f'; ctx.fillRect(0, 0, W, H);
  if (anyPic){
    /* cross-fade every 9 s */
    const cyc = (t % 18) / 18, fade = x => Math.min(1, Math.max(0, x));
    const k = Math.sin(cyc * Math.PI * 2) * 3;               /* -3..3, clamp to a soft square wave */
    const mix = fade(.5 - k);                                 /* 0 = first picture, 1 = second */
    if (ready(pics[0])) drawPic(pics[0], 1, t, 1);
    if (ready(pics[1])) drawPic(pics[1], ready(pics[0]) ? mix : 1, t + 40, -1);
  }
  ctx.globalCompositeOperation = 'lighter';
  const strength = anyPic ? .16 : .5;
  BLOTS.forEach(b => {
    const x = W * (.5 + Math.cos(t * .24 * b.sx + b.ph) * .38);
    const y = H * (.5 + Math.sin(t * .24 * b.sy + b.ph * 1.7) * .34);
    const r = Math.max(W, H) * b.r * (1 + Math.sin(t * .5 + b.ph) * .12);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${b.c},${strength})`);
    g.addColorStop(1, `rgba(${b.c},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  });
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
})();
</script>
<!-- SIGNATURE CURSOR -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; mix-blend-mode:difference; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--bone); transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(245,243,237,.85); transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease; }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--bone); mix-blend-mode:difference; transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  dot.style.opacity=ring.style.opacity='0';   /* hidden until the first pointer move, so nothing parks over the copy */
  document.body.append(dot,ring);
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{if(ring.style.opacity){rx=e.clientX;ry=e.clientY;dot.style.opacity=ring.style.opacity='';}mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
})();
</script>
</body>
</html>
