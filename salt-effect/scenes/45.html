<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>The Salt Effect · Fireflies</title>
<!-- LANTERN · Fireflies Field. Story position 39/76, Chapter IV · The town.
     Fireflies drift on their own; the cursor is a lantern they gather around, and the ones
     gathered near it fall into step and blink together. Hold to let them go. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0; --lilac:#eae7f4; --mist:#b3aacd;
    --plum:#635a7d; --ink-text:#201439;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse 120% 80% at 50% 78%, var(--ink-2) 0%, var(--ink-1) 42%, var(--ink-0) 100%);
    color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .center{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;padding:88px 16px 72px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:.98;
    font-size:clamp(38px,6.2vw,92px);color:var(--bone);max-width:15ch;text-wrap:balance;
    text-shadow:0 2px 30px rgba(14,8,31,.85)}
  h1 .soft{display:block;color:var(--mist);font-size:.62em;font-weight:500;margin-bottom:.32em}
  h1 em{font-style:italic;color:var(--amber-hi)}
  .line{margin-top:26px;font-size:clamp(17px,1.5vw,20px);line-height:1.55;color:var(--lilac);max-width:40ch;text-wrap:balance;
    text-shadow:0 1px 18px rgba(14,8,31,.9)}
  .hint{margin-top:22px;color:var(--amber);opacity:.9}
  .hud{position:fixed;z-index:10}
  .t1{top:84px;left:32px}
  .b1{bottom:26px;left:32px}
  .b2{bottom:26px;right:32px;text-align:right}
  .hint .touch{display:none}
  @media (hover:none){ .hint .fine{display:none} .hint .touch{display:inline} }
  @media (max-width:640px){
    .t1{left:16px;top:80px}
    .b1{left:16px;bottom:18px;max-width:46%}
    .b2{right:16px;bottom:18px;max-width:46%}
    .hud.mono{font-size:11px}
    .center{padding:110px 16px 90px}
  }
</style>
</head>
<body>
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="center">
    <h1><span class="soft">Alone, a firefly flickers.</span>Together they <em>light up</em> a field.</h1>
    <p class="line">That's what a town full of good businesses looks like.</p>
    <span class="mono hint"><span class="fine">Your cursor is a lantern · hold to let them go</span><span class="touch">Touch the field · they gather to your light</span></span>
  </div>
  <span class="mono hud t1">IV · The town — 39/76</span>
  <span class="mono hud b1"><span id="lit">220</span> fireflies<br><span id="sync">0</span> blinking in step</span>
  <span class="mono hud b2">Elkmont, Smokies<br>every June</span>

<script>
(function(){
  const COUNT = innerWidth < 640 ? 150 : 220;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const syncEl = document.getElementById('sync');
  document.getElementById('lit').textContent = COUNT;
  let W, H, DPR;
  const fit = () => {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  fit(); addEventListener('resize', fit);

  /* pre-rendered glow sprites: amber (#e9a13b) and its hot core (#f0b055 to bone) */
  function sprite(stops, size){
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), r = size / 2;
    const gr = g.createRadialGradient(r, r, 0, r, r, r);
    stops.forEach(s => gr.addColorStop(s[0], s[1]));
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
    return c;
  }
  const GLOW = sprite([[0,'rgba(240,176,85,.9)'],[.25,'rgba(233,161,59,.35)'],[1,'rgba(233,161,59,0)']], 64);
  const CORE = sprite([[0,'rgba(245,243,237,1)'],[.35,'rgba(240,176,85,.95)'],[1,'rgba(233,161,59,0)']], 16);

  const flies = Array.from({ length: COUNT }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: 0, vy: 0,
    ph: Math.random() * Math.PI * 2,     /* blink phase */
    sp: .05 + Math.random() * .02,       /* own blink speed */
    wander: Math.random() * Math.PI * 2,
    near: 0
  }));

  let mx = W / 2, my = H * .62, held = false, lastMove = -1e9;
  const setP = e => { mx = e.clientX; my = e.clientY; lastMove = performance.now(); };
  addEventListener('pointermove', setP);
  addEventListener('pointerdown', e => { setP(e); if (e.pointerType === 'mouse') held = true; });
  addEventListener('pointerup', () => held = false);
  addEventListener('pointercancel', () => held = false);
  addEventListener('blur', () => held = false);

  /* faint ridge line at the foot of the field */
  function ridge(){
    ctx.fillStyle = 'rgba(14,8,31,.7)';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 24){
      const y = H * .9 - Math.sin(x * .004 + 1.3) * H * .035 - Math.sin(x * .011) * H * .012;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.fill();
  }

  let frame = 0;
  (function loop(){
    requestAnimationFrame(loop);
    const now = performance.now(), t = now / 1000;
    /* idle: the lantern wanders by itself */
    if (now - lastMove > 3000){
      if (W < 640){ mx = W * (.5 + Math.cos(t * .45) * .3); my = H * (.8 + Math.sin(t * .6) * .05); }
      else { mx = W * (.5 + Math.cos(t * .4) * .34); my = H * (.52 + Math.sin(t * .4) * .3); }
    }
    ctx.clearRect(0, 0, W, H);

    /* lantern glow at the cursor */
    const lg = ctx.createRadialGradient(mx, my, 0, mx, my, 170);
    lg.addColorStop(0, 'rgba(233,161,59,.16)'); lg.addColorStop(1, 'rgba(233,161,59,0)');
    ctx.fillStyle = lg; ctx.fillRect(mx - 170, my - 170, 340, 340);

    /* the lantern's shared rhythm: flies near it pull their phase toward it */
    const beat = t * 3.4;
    let inStep = 0;
    ctx.globalCompositeOperation = 'lighter';
    for (const f of flies){
      f.wander += (Math.random() - .5) * .3;
      f.vx += Math.cos(f.wander) * .045;
      f.vy += Math.sin(f.wander) * .045;
      const dx = mx - f.x, dy = my - f.y;
      const d = Math.hypot(dx, dy) || 1;
      if (!held && d < 340 && d > 46){
        f.vx += dx / d * .11; f.vy += dy / d * .11;
      } else if (held && d < 260){
        f.vx -= dx / d * .5; f.vy -= dy / d * .5;
      }
      f.vx *= .96; f.vy *= .96;
      f.x += f.vx; f.y += f.vy;
      if (f.x < -20) f.x = W + 20; if (f.x > W + 20) f.x = -20;
      if (f.y < -20) f.y = H + 20; if (f.y > H + 20) f.y = -20;

      /* together: near the lantern, phases ease into the shared beat */
      const target = !held && d < 200 ? 1 : 0;
      f.near += (target - f.near) * .02;
      f.ph += f.sp + Math.random() * .01;
      if (f.near > .05){
        const diff = Math.atan2(Math.sin(beat - f.ph), Math.cos(beat - f.ph));
        f.ph += diff * .06 * f.near;
        if (f.near > .6 && Math.abs(diff) < .4) inStep++;
      }
      const blink = Math.max(0, Math.sin(f.ph)) ** 3;
      const gr = 15 + blink * 12 + f.near * 6;
      ctx.globalAlpha = (.05 + .45 * blink) * (1 - f.near * .5);
      ctx.drawImage(GLOW, f.x - gr, f.y - gr, gr * 2, gr * 2);
      const cr = 2.2 + blink * 2.6;
      ctx.globalAlpha = (.4 + blink * .6) * (1 - f.near * .3);
      ctx.drawImage(CORE, f.x - cr, f.y - cr, cr * 2, cr * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ridge();
    if (++frame % 15 === 0) syncEl.textContent = inStep;
  })();
})();
</script>

<!-- cursor: lantern dot and ring (fine pointers only) -->
<style>
@media (hover:hover) and (pointer:fine){
  *{cursor:none !important}
  #wlDot,#wlRing{position:fixed;top:0;left:0;pointer-events:none;z-index:9999}
  #wlDot{width:6px;height:6px;border-radius:50%;background:var(--amber-hi);transform:translate(-50%,-50%)}
  #wlRing{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(233,161,59,.85);transform:translate(-50%,-50%)}
  .wlRipple{position:fixed;pointer-events:none;z-index:9998;width:8px;height:8px;border-radius:50%;border:2px solid var(--amber);transform:translate(-50%,-50%);animation:wlrip .55s ease-out forwards}
  @keyframes wlrip{to{width:70px;height:70px;opacity:0}}
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot = document.createElement('div'); dot.id = 'wlDot';
  const ring = document.createElement('div'); ring.id = 'wlRing';
  document.body.append(dot, ring);
  let mx = -100, my = -100, rx = mx, ry = my;
  addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; });
  (function f(){ rx += (mx - rx) * .16; ry += (my - ry) * .16; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(f); })();
  addEventListener('mousedown', e => { const r = document.createElement('div'); r.className = 'wlRipple'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 600); });
})();
</script>
</body>
</html>
