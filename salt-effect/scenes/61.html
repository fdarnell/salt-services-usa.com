<!DOCTYPE html>
<html lang="en" data-scene="static">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="_bridge.js"></script>
<title>The Salt Effect · Somebody decides</title>
<!-- Scene 6/76 · from template 61 ROTOR Word Cycler.
     One headline, a rotating verb: flip, blur or slide, switched live with the chips.
     The slot eases to each new word's width instead of jumping. -->
<link rel="stylesheet" href="../kit/fonts/fonts.css">
<style>
  :root{
    --ink-0:#0e081f; --ink-1:#180f2f; --ink-2:#2b1d52;
    --amber:#e9a13b; --amber-hi:#f0b055;
    --bone:#f5f3ed; --bone-2:#ece9e0;
    --lilac:#eae7f4; --mist:#b3aacd; --plum:#635a7d; --ink-text:#201439;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { color:var(--lilac); font-family:'Instrument Sans',system-ui,sans-serif; display:flex; flex-direction:column;
    background:
      radial-gradient(46% 40% at 50% 54%, rgba(233,161,59,.10), transparent 70%),
      radial-gradient(90% 70% at 50% 50%, var(--ink-1), var(--ink-0) 85%); }
  .mono { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); }

  header { display:flex; justify-content:space-between; padding:88px 38px 0; }
  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:38px; text-align:center; padding:0 5vw; }
  h1 { font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(40px,6.6vw,104px); letter-spacing:-.02em; line-height:1.12; color:var(--bone); }
  .slot { display:inline-block; position:relative; vertical-align:bottom; overflow:hidden; text-align:left; padding:0 .06em .04em;
    color:var(--amber); font-style:italic; font-weight:500; border-bottom:3px solid rgba(233,161,59,.38); min-width:1ch;
    transition:width .5s cubic-bezier(.19,1,.22,1); }
  .slot .word { display:inline-block; white-space:nowrap; }
  .sizer { position:absolute; visibility:hidden; white-space:nowrap; pointer-events:none; }

  /* flip style */
  .flip .word.out { animation:flipOut .45s cubic-bezier(.76,0,.24,1) forwards; }
  .flip .word.in  { animation:flipIn  .45s cubic-bezier(.19,1,.22,1) forwards; }
  @keyframes flipOut { to { transform:translateY(-110%); opacity:0; } }
  @keyframes flipIn  { from { transform:translateY(110%); opacity:0; } to { transform:none; opacity:1; } }
  /* blur style */
  .blurs .word.out { animation:blOut .4s forwards; }
  .blurs .word.in  { animation:blIn .55s forwards; }
  @keyframes blOut { to { filter:blur(12px); opacity:0; transform:scale(1.06); } }
  @keyframes blIn  { from { filter:blur(12px); opacity:0; transform:scale(.94); } to { filter:blur(0); opacity:1; transform:none; } }
  /* slide style */
  .slide .word.out { animation:slOut .4s cubic-bezier(.76,0,.24,1) forwards; }
  .slide .word.in  { animation:slIn .5s cubic-bezier(.19,1,.22,1) forwards; }
  @keyframes slOut { to { transform:translateX(-40%); opacity:0; } }
  @keyframes slIn  { from { transform:translateX(40%); opacity:0; } to { transform:none; opacity:1; } }

  .line { font-size:clamp(17px,1.5vw,20px); line-height:1.55; color:var(--lilac); }
  .chips { display:flex; gap:8px; }
  .chips button { font-family:'Space Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    background:rgba(234,231,244,.04); border:1px solid var(--ink-2); color:var(--mist); padding:11px 20px;
    border-radius:999px; cursor:pointer; transition:all .3s; }
  .chips button:hover, .chips button:focus-visible { border-color:var(--amber); color:var(--bone); outline:none; }
  .chips button.on { background:var(--amber); color:var(--ink-0); border-color:var(--amber); }
  footer { display:flex; justify-content:space-between; padding:26px 38px; }
  #n { color:var(--amber); }
  @media (max-width:640px){
    header { padding:88px 20px 0; } footer { padding:22px 20px; }
    header .coords { display:none; }
    h1 { font-size:clamp(40px,12vw,52px); }
    .stage { gap:30px; }
  }
</style>
</head>
<body>
  <header><span class="mono">I · The grain — 6/76</span><span class="mono coords">Kodak, TN · 35.97° N, 83.62° W</span></header>

  <div class="stage">
    <h1>Somebody decides to<br><span class="slot flip" id="slot"><span class="word in" id="word">bake.</span></span></h1>
    <p class="line">The verb changes. The decision doesn't.</p>
    <div class="chips" role="group" aria-label="Change style">
      <button data-s="flip" class="on" type="button">Flip</button>
      <button data-s="blurs" type="button">Blur</button>
      <button data-s="slide" type="button">Slide</button>
    </div>
  </div>

  <footer><span class="mono">Verb <span id="n">1</span> of 6</span><span class="mono">One decision</span></footer>

<script>
const WORDS = ['bake.', 'build.', 'fix.', 'teach.', 'heal.', 'serve.'];
const INTERVAL = 2400;

const slot = document.getElementById('slot'), n = document.getElementById('n');
const sizer = document.createElement('span'); sizer.className = 'sizer'; slot.appendChild(sizer);
let wi = 0, busy = false;

/* the slot eases to the width of the word that is coming */
function widthOf(text){ sizer.textContent = text; return sizer.getBoundingClientRect().width; }
function setWidth(text){ slot.style.width = (widthOf(text) + parseFloat(getComputedStyle(slot).paddingLeft) * 2) + 'px'; }

function cycle(){
  if (busy) return; busy = true;
  const cur = slot.querySelector('.word');
  cur.classList.remove('in'); cur.classList.add('out');
  const nextI = (wi + 1) % WORDS.length;
  setWidth(WORDS[nextI]);
  setTimeout(() => {
    wi = nextI;
    const next = document.createElement('span');
    next.className = 'word in';
    next.textContent = WORDS[wi];
    cur.remove();
    slot.appendChild(next);
    n.textContent = wi + 1;
    busy = false;
  }, 430);
}
document.fonts.ready.then(() => setWidth(WORDS[wi]));
addEventListener('resize', () => setWidth(WORDS[wi]));
setInterval(cycle, INTERVAL);

document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.chips button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  slot.className = 'slot ' + b.dataset.s;
}));
</script>
<!-- signature cursor, brand colours, off on touch -->
<style>
@media (hover:hover) and (pointer:fine){
  * { cursor:none !important; }
  #wlDot,#wlRing{ position:fixed; top:0; left:0; pointer-events:none; z-index:9999; opacity:0; transition:opacity .2s; }
  #wlDot{ width:6px; height:6px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); }
  #wlRing{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(234,231,244,.75); transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease, opacity .2s; }
  .cur-on #wlDot, .cur-on #wlRing { opacity:1; }
  .wlRipple{ position:fixed; pointer-events:none; z-index:9998; width:8px; height:8px; border-radius:50%; border:2px solid var(--amber); transform:translate(-50%,-50%); animation:wlrip .55s ease-out forwards; }
  @keyframes wlrip{ to{ width:70px; height:70px; opacity:0; } }
}
</style>
<script>
(function(){
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const dot=document.createElement('div'); dot.id='wlDot';
  const ring=document.createElement('div'); ring.id='wlRing';
  document.body.append(dot,ring);
  const R=document.documentElement;
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';R.classList.add('cur-on');});
  document.addEventListener('mouseleave',()=>R.classList.remove('cur-on'));
  (function f(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(f)})();
  addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='wlRipple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);});
  document.body.addEventListener('mouseover',e=>{
    const hit = e.target.closest('a,button');
    ring.style.width = hit ? '60px' : '36px'; ring.style.height = hit ? '60px' : '36px';
  });
})();
</script>
</body>
</html>
